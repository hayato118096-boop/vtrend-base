<!doctype html>
<html lang="ja" data-theme="light">
<head>

    fontFamily: { sans:['"Noto Sans JP"','system-ui','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] }

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f7fb; --fg:#1f2433; }
  body { background:var(--bg); color:var(--fg); overflow-x:hidden; }
  .grid-bg { background-image:
      linear-gradient(rgba(8,145,178,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(8,145,178,.05) 1px, transparent 1px);
    background-size: 32px 32px; }
  .glow { box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(8,145,178,.10); }
  .glow-pink { box-shadow: 0 0 0 1px rgba(219,39,119,.35), 0 4px 16px rgba(219,39,119,.12); }
  .chip { transition: all .15s; }
  .chip[aria-pressed="true"] { background:#0891b2; color:#fff; border-color:#0891b2; box-shadow:0 2px 8px rgba(8,145,178,.25); }
  .tab[aria-selected="true"] { color:#0891b2; }

<body class="font-sans min-h-screen grid-bg">

<header class="sticky top-0 z-30 bg-void/90 backdrop-blur border-b border-line">
  <div class="max-w-7xl mx-auto px-4 pt-3 flex items-center gap-3">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon to-pink grid place-items-center font-black text-white">V</div>
      <div class="leading-tight hidden sm:block">
        <div class="font-black tracking-wide">VTrend <span class="text-neon">Base</span></div>
        <div class="text-[10px] text-muted font-mono">JP TREND INTELLIGENCE</div>
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <label class="relative block">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm">⌕</span>

      </label>
    </div>
    <div class="shrink-0 flex items-center gap-2 bg-panel border border-line rounded-lg px-2.5 sm:px-3 py-2 text-[11px] sm:text-xs" title="データは毎日0時過ぎ（日本時間）に自動更新されます">
      <span id="modeDot" class="w-2 h-2 rounded-full bg-amber"></span><span id="modeLabel" class="font-mono whitespace-nowrap">…</span>
    </div>
  </div>
  <nav class="max-w-7xl mx-auto px-2 mt-2 flex overflow-x-auto no-scrollbar" role="tablist">
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="rising" role="tab">🌱 伸び盛り</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="trend" role="tab">📈 トレンド</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="clip" role="tab">✂️ 切り抜き</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="words" role="tab">🔍 <span class="hidden sm:inline">検索</span>ワード</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="content" role="tab">🔥 コンテンツ</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="know" role="tab">🌐 <span class="hidden sm:inline">解説</span>ナレッジ</button>

<main class="max-w-7xl mx-auto px-4 py-5 pb-20">

</main>

<!-- ポップアウト -->
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div class="sheet relative mx-auto mt-2 sm:mt-4 w-[calc(100%-12px)] sm:w-[calc(100%-32px)] max-w-2xl bg-panel border border-line rounded-2xl glow overflow-y-auto">

      <button id="mBack" class="hidden text-sm text-muted hover:text-neon">← 戻る</button>
      <div id="mTitle" class="font-bold text-sm truncate flex-1"></div>
      <button data-close class="text-muted hover:text-ink text-2xl leading-none px-1" aria-label="閉じる">×</button>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-panel border border-neon/40 text-sm rounded-full px-4 py-2 glow shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

<script>
/* =====================================================================
   0. ユーティリティ
   ===================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '億';
  if (n >= 1e4) return (n/1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,'') + '万';
  return Math.round(n).toLocaleString('ja-JP');
};
const DAY = 864e5;
const rtf = new Intl.RelativeTimeFormat('ja', { numeric:'auto' });
const ago = d => {
  const s = (d - Date.now()) / 1000, a = Math.abs(s);
  if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if (a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return rtf.format(Math.round(s/86400/30), 'month');
};
const ytSearchUrl = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
// タッチ端末（スマホ・タブレット）はリンクで開く。PCは埋め込み先でリンクがブロックされるのでコピー方式
const TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 1800);
}
async function copyText(text, msg = 'コピーしました') {
  try { await navigator.clipboard.writeText(text); return toast('📋 ' + msg); } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  toast(ok ? '📋 ' + msg : '下の欄を選択してコピーしてね');
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function median(a) { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
function spark(arr, w=72, h=22) {
  arr = (arr || []).filter(x => x != null);
  if (arr.length < 2) return '<span class="text-[10px] text-muted">推移データ蓄積中</span>';
  const min = Math.min(...arr), max = Math.max(...arr), r = max - min || 1;
  const pts = arr.map((v,i) => `${(i/(arr.length-1)*w).toFixed(1)},${(h - (v-min)/r*(h-4) - 2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${arr[arr.length-1] >= arr[0] ? '#16a34a' : '#db2777'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

/* リンク：スマホは開く、PCはURLとコピー */
function linkBox(url, label = 'YouTubeで開く') {
  const open = TOUCH ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="block text-center bg-neon text-white font-bold rounded-lg px-4 py-2.5 text-sm mb-2">▶ ${esc(label)}</a>` : '';
  return `${open}<div class="flex gap-2">
    <input readonly value="${esc(url)}" class="flex-1 min-w-0 bg-void border border-line rounded-lg px-2 py-2 text-xs font-mono" data-selectall>
    <button class="shrink-0 ${TOUCH ? 'border border-line' : 'bg-neon text-white'} font-bold rounded-lg px-3 text-xs" data-copy="${esc(url)}">📋 コピー</button>
  </div>`;
}
function miniLink(url, text) {
  return TOUCH
    ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="text-xs text-neon font-bold hover:underline">▶ ${esc(text)}</a>`
    : `<button class="text-xs text-neon font-bold hover:underline" data-copy="${esc(url)}" data-copymsg="URLをコピーしました">📋 ${esc(text)}のURLをコピー</button>`;
}

/* =====================================================================
   1. 定数
   ===================================================================== */
const GENRES = [
  { id:'all',  label:'すべて' },
  { id:'game', label:'ゲーム' },
  { id:'horror', label:'👻 ホラー' },
  { id:'song', label:'歌ってみた' },
  { id:'talk', label:'雑談' },
  { id:'plan', label:'企画' },
];
const FORMATS = [
  { id:'all',    label:'すべて' },
  { id:'video',  label:'🎬 動画' },
  { id:'stream', label:'🔴 配信' },
  { id:'short',  label:'📱 ショート' },
];
const FMT_LABEL = { video:'動画', stream:'配信', short:'ショート' };
const SORTS = [
  { id:'ratio',  label:'伸び率（再生÷登録者）' },
  { id:'views',  label:'再生数' },
  { id:'new',    label:'新しい順' },
  { id:'engage', label:'高評価率' },
];
const CAPS = [[10000,'〜1万人'],[50000,'〜5万人'],[100000,'〜10万人'],[200000,'〜20万人']];
const ST = { new:['✨ 新登場','text-pink border-pink/40 bg-pink/10'], up:['🔥 急上昇','text-amber border-amber/40 bg-amber/10'], steady:['📈 継続中','text-neon border-neon/40 bg-neon/10'], down:['↘ 落ち着き','text-muted border-line bg-ink/5'] };
const STOP = new Set(['vtuber','vtubers','新人vtuber','個人vtuber','vtuber準備中','新人vtuber準備中','shorts','short','ショート','切り抜き','ホロライブ','にじさんじ','hololive','nijisanji','ぶいすぽ','歌ってみた','cover','covered by','歌枠','雑談','雑談配信','ゲーム実況','実況','初見','初見プレイ','初見実況','ネタバレ注意','縦型配信','縦型','配信','live','ライブ配信','生配信','新人','おすすめ','fyp','viral','女性実況','男性vtuber','女性vtuber','vtuber好きと繋がりたい','jpvtuber','envtuber','music','mv','ゲーム','企画','shorts動画','youtube','youtubeshorts','ytshorts','trending','funny','anime','アニメ','live2d','3d','asmr配信']);
function tokenize(title) {
  const t = String(title || '').normalize('NFKC'), out = new Map();
  const add = w => { w = w.trim().replace(/^#+/, '').replace(/\s+/g, ' '); const k = w.toLowerCase();
    if (w.length < 2 || w.length > 24 || /^[\d\s.\-#]+$/.test(w) || STOP.has(k) || k.endsWith('切り抜き') || k.startsWith('vtuber')) return;
    if (!out.has(k)) out.set(k, w); };
  for (const m of t.matchAll(/【([^】]+)】/g)) m[1].split(/[\/|・,、]/).forEach(add);
  for (const m of t.matchAll(/『([^』]+)』/g)) add(m[1]);
  for (const m of t.matchAll(/#([^\s#]+)/g)) add(m[1]);
  return out;
}

/* =====================================================================
   2. 状態
   ===================================================================== */
const S = {
  tab: ['rising','trend','clip','words','content','know'].includes(store.get('vtb_tab2', 'rising')) ? store.get('vtb_tab2', 'rising') : 'rising',
  data: null, mode: 'demo',
  genre: 'all', format: 'all', period: 7, sort: 'ratio', cap: 200000,
  q: '',
  kw: { src: 'tokens', genre: 'all' },
  ct: { tab: 'now', genre: 'all', format: 'all', gmode: 'soon', ggenre: 'all', cgenre: 'all' },
  clip: { view: 'ch', range: 'all', fmt: 'all', period: 7, sort: 'subs' },
  arch: { year:'all', genre:'all', type:'all', revival:'all', sort:'new' },
  kcat: 'all', kopen: null,
};
let BM = store.get('vtb_bm2', null);
if (!BM) { const o = store.get('vtb_bm', {}); BM = { v: o.trend || {}, arch: o.arch || {}, know: o.know || {} }; }
const saveBM = () => { store.set('vtb_bm2', BM); updateBMCount(); };
const updateBMCount = () => { const el = $('#bmCount'); if (el) el.textContent = Object.keys(BM.v).length + Object.keys(BM.arch).length + Object.keys(BM.know).length; };

/* =====================================================================
   3. データ読み込み（data.json は GitHub Actions が毎日0時過ぎに生成）
   ===================================================================== */
function enrich(v) {
  v.published = new Date(v.published);
  v.url = 'https://www.youtube.com/watch?v=' + v.id;
  v.thumb = v.demo ? '' : `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
  v.stream = !!v.stream || v.live != null;
  v.fmt = v.stream ? 'stream' : (v.dur > 0 && v.dur <= 180 ? 'short' : 'video');
  v.ratio = v.subs ? v.views / v.subs : null;
  return v;
}
async function loadData() {
  try {
    const d8 = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    const r = await fetch('data.json?d=' + d8, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.pools) throw new Error('old format');
    Object.values(d.videos).forEach(enrich);
    for (const g of Object.keys(d.tokens || {})) {
      d.tokens[g].forEach(t => { t.top = t.top.filter(id => isJP(d.videos[id])); });
      d.tokens[g] = d.tokens[g].filter(t => t.top.length);
    }
    S.data = d; S.mode = 'live';
  } catch (e) { S.data = demoData(); S.mode = 'demo'; }
  try { const r = await fetch('classics.json', { cache: 'no-cache' }); if (r.ok) CLASSICS = await r.json(); } catch (e) {}
}

/* 架空のサンプル（data.json が無いときだけ使用） */
function demoData() {
  const r = rng(20261104);
  const chans = ['星宮ルナ','黒羽ネオ','白雪ミント','鳴神カグラ','月見里ユウ','猫宮ぽぷら','天ヶ瀬ソラ','夜桜しずく','雷堂ジン','花咲ここ','氷室アオイ','灯火リラ','紫苑メイ','朝霧ハル','狐火こはく','碧海ナギ','七瀬ルル','鉄塚ゴウ']
    .map((name, i) => ({ name, id:'demo-ch-'+i, subs: Math.round(Math.exp(7.5 + r()*7)) }));
  const T = {
    game: ['【PEAK】4人で山頂を目指したら友情が崩壊した','【R.E.P.O.】ポンコツ回収班、出動します','【マリオカート ワールド】視聴者参加型！','【スト6】ランクマ耐久','【初見ホラー】叫ばずに完走できたら勝ち','【Minecraft】巨大建築つくる','【PEAK】ついに山頂へ #PEAK'],
    song: ['【歌ってみた】メズマライザー / cover','【歌枠】リクエスト全部歌う耐久','【オリジナル曲】初MV公開','【歌ってみた】ラビットホール / cover'],
    talk: ['【雑談】マシュマロ読みながらまったり','【朝活】おはようを言いに来て','【雑談】最近ハマってるもの全部話す','【作業雑談】一緒に作業しよ'],
    plan: ['【凸待ち】誰か来てくれるまで終われない','【企画】100人に聞いたランキングを当てる','【3D】初お披露目','【企画】1日を視聴者に決めてもらう'],
  };
  const gs = Object.keys(T), videos = {};
  for (let i = 0; i < 420; i++) {
    const genre = gs[Math.floor(r()*gs.length)], c = chans[Math.floor(r()*chans.length)];
    const fmtR = r(), f = fmtR < 0.4 ? 'video' : fmtR < 0.7 ? 'stream' : 'short';
    const title = T[genre][Math.floor(r()*T[genre].length)] + (f === 'short' ? ' #shorts' : '');
    let mult = Math.exp((r() - 0.6) * 2.6); if (r() < 0.12) mult *= 4 + r()*10;
    const views = Math.max(120, Math.round(c.subs * mult * (c.subs < 30000 ? 1.4 : 0.5)));
    videos['demo-'+i] = enrich({ id:'demo-'+i, title, ch:c.name, chId:c.id, subs:c.subs, views,
      likes: Math.round(views*(0.025+r()*0.06)), comments: Math.round(views*(0.002+r()*0.01)),
      published: new Date(Date.now() - r()*30*DAY).toISOString(), dur: f === 'short' ? 30 : 900 + Math.round(r()*5000),
      stream: f === 'stream', live: f === 'stream' && r() < 0.1 ? Math.round(c.subs*0.03) : null, demo:true, genre });
  }
  const all = Object.values(videos), pools = {};
  for (const g of GENRES) for (const f of ['video','stream','short']) {
    const base = all.filter(v => (g.id === 'all' || v.genre === g.id) && v.fmt === f);
    pools[`${g.id}|${f}|7`] = base.filter(v => Date.now() - v.published < 7*DAY).sort((a,b) => b.views - a.views).slice(0, 100).map(v => v.id);
    pools[`${g.id}|${f}|30`] = base.sort((a,b) => b.views - a.views).slice(0, 50).map(v => v.id);
    pools[`${g.id}|${f}|new`] = base.filter(v => Date.now() - v.published < 7*DAY).sort((a,b) => b.published - a.published).slice(0, 50).map(v => v.id);
  }
  // サンプルの切り抜き動画
  ['てぇてぇ切り抜きch','VTuber名場面切り抜き堂','ぶいぶい切り抜き'].forEach((name, ci) => {
    const subs = [8000, 64000, 420000][ci];
    for (let i = 0; i < 12; i++) {
      const id = `demo-clip-${ci}-${i}`, f = r() < 0.5 ? 'short' : 'video', views = Math.round(subs * (0.2 + r()*3));
      videos[id] = enrich({ id, title: `【切り抜き】${chans[Math.floor(r()*chans.length)].name}の神回まとめ ${i+1}`, ch:name, chId:'demo-clipch-'+ci, subs, views,
        likes: Math.round(views*0.04), comments: Math.round(views*0.003), published: new Date(Date.now() - r()*25*DAY).toISOString(),
        dur: f === 'short' ? 45 : 600, stream:false, live:null, demo:true, genre:'talk' });
    }
  });
  const clipAll = Object.values(videos).filter(v => v.id.startsWith('demo-clip'));
  for (const f of ['video','short']) {
    pools[`clip|${f}|7`] = clipAll.filter(v => v.fmt === f && Date.now() - v.published < 7*DAY).map(v => v.id);
    pools[`clip|${f}|30`] = clipAll.filter(v => v.fmt === f).map(v => v.id);
  }
  const tokens = {};
  for (const g of GENRES) {
    const agg = new Map();
    all.filter(v => g.id === 'all' || v.genre === g.id).forEach(v => tokenize(v.title).forEach((w, k) => { const a = agg.get(k) || { k, w, ids: [] }; a.ids.push(v.id); agg.set(k, a); }));
    tokens[g.id] = [...agg.values()].map(a => ({ k:a.k, w:a.w, n:a.ids.length, views:a.ids.reduce((s,id) => s + videos[id].views, 0),
      st:['new','up','steady','down'][Math.floor(r()*4)], fm:{video:0,stream:0,short:0}, top:a.ids.sort((x,y) => videos[y].views - videos[x].views).slice(0,12) }))
      .sort((a,b) => b.n - a.n);

  return { updated: new Date().toISOString(), pools, videos, subs, histDays: [], tokens, suggest,

}

/* =====================================================================
   4. リストの組み立て・理由
   ===================================================================== */
const V = id => S.data.videos[id];
const ageDays = v => (Date.now() - v.published) / DAY;
const matchQ = v => !S.q || (v.title + v.ch).toLowerCase().includes(S.q.toLowerCase());
// 日本の動画だけ：タイトルに日本語（かな・漢字）がある、または音声言語が日本語
const JA = /[぀-ヿ一-鿿]/;
const isJP = v => !!v && (JA.test(v.title || '') || /^ja/i.test(v.lang || ''));
// 切り抜き：タイトルかチャンネル名に「切り抜き」「clip」など（トレンド・伸び盛りからは外して、切り抜きタブにまとめる）
const isClip = v => /切り抜き|切抜き|きりぬき|\bclips?\b/i.test((v.title || '') + ' ' + (v.ch || ''));
const SORTFN = {
  ratio:  (a, b) => (b.ratio ?? -1) - (a.ratio ?? -1),
  views:  (a, b) => b.views - a.views,
  new:    (a, b) => b.published - a.published,
  engage: (a, b) => (b.views ? b.likes / b.views : 0) - (a.views ? a.likes / a.views : 0),
};
/* ジャンル × 形式 × 期間 で最大50件。7日で足りないときは30日以内から補充 */
function buildList({ genre, format, period, cap = null, sort = 'ratio', minViews = 0, limit = 50 }) {
  const P = S.data.pools, fmts = format === 'all' ? ['video','stream','short'] : [format];
  const seen = new Set(), main = [], sup = [];
  const ok = v => isJP(v) && !isClip(v) && (!cap || (v.subs != null && v.subs <= cap)) && v.views >= minViews && matchQ(v);
  const push = (arr, id) => { if (seen.has(id)) return; const v = V(id); if (!ok(v)) return; seen.add(id); arr.push(v); };
  for (const f of fmts) {
    const src = period === 7 ? ['7','new'] : ['30','7','new'];
    src.forEach(p => (P[`${genre}|${f}|${p}`] || []).forEach(id => push(main, id)));
  }
  main.sort(SORTFN[sort]);
  let list = main.slice(0, limit);
  const supSet = new Set();
  if (list.length < limit && period === 7) {
    for (const f of fmts) (P[`${genre}|${f}|30`] || []).forEach(id => push(sup, id));
    sup.sort(SORTFN[sort]);
    sup.slice(0, limit - list.length).forEach(v => { supSet.add(v.id); list.push(v); });

  return { list, supSet };
}
function ruleReasons(v) {

  const like = v.views ? v.likes / v.views : 0, com = v.views ? v.comments / v.views : 0;
  if (r != null && r >= 5) R.push(['🚀', `登録者の${r.toFixed(1)}倍再生`, 'チャンネル登録者以外にも大きく広がっています。おすすめ・関連動画・検索から新しい視聴者が流入したと考えられます。']);
  else if (r != null && r >= 1.5) R.push(['📈', `登録者の${r.toFixed(1)}倍再生`, '普段の視聴者層を超えて再生されています。']);
  if (d <= 7 && perDay >= 10000) R.push(['⚡', '初速が強い', `公開から${d < 1 ? Math.round(d*24)+'時間' : Math.round(d)+'日'}で${fmt(v.views)}回（1日あたり約${fmt(perDay)}回）。公開直後の反応が良く、おすすめに押し上げられたと考えられます。`]);
  if (like >= 0.05) R.push(['👍', `高評価率 ${(like*100).toFixed(1)}%`, '満足度が高い動画は、おすすめに表示されやすくなります。']);
  if (com >= 0.004) R.push(['💬', 'コメントが活発', `コメント率 ${(com*100).toFixed(2)}%。視聴者の参加や盛り上がりが起きています。`]);
  const tk = [...tokenize(v.title).keys()];
  (S.data.tokens.all || []).filter(t => tk.includes(t.k || t.w.toLowerCase())).slice(0, 2)
    .forEach(t => R.push(['🔥', `流行ワード「${t.w}」`, `今週「${t.w}」を含む動画が${t.n}本あり、話題の波に乗っています。`]));
  if (v.fmt === 'short') R.push(['📱', 'ショート動画', 'スワイプで次々と表示されるため、登録者以外の人に届きやすい形式です。']);
  if (v.fmt === 'stream') R.push(['🔴', v.live != null ? '配信中' : '配信アーカイブ', v.live != null ? `今まさに配信中で、同時接続 ${fmt(v.live)}人。` : 'ライブ配信の盛り上がりが、そのままアーカイブの再生につながっています。']);
  if (/コラボ|collab|w\/|×/i.test(v.title)) R.push(['🤝', 'コラボ', '複数の配信者のファンが、お互いのチャンネルに流れ込みやすい企画です。']);
  if (/切り抜き/.test(v.title + v.ch)) R.push(['✂️', '切り抜き', '配信の名場面だけを短く再編集した動画は、元の配信を見ていない人にも届きやすいです。']);
  if (v.subs != null && v.subs < 10000 && v.views >= 50000) R.push(['🌱', '小規模チャンネルからのバズ', `登録者${fmt(v.subs)}人のチャンネルから${fmt(v.views)}回再生。企画やサムネイルの力で伸びた例です。`]);
  if (!R.length) R.push(['📊', '安定した再生', '突出した要因は見当たりませんが、ジャンル内で上位の再生数です。']);
  return R;
}
function tokenReason(t, g) {

  const st = { new:'今週新しく登場したワードです。', up:'前回より投稿数が大きく増えている急上昇ワードです。', down:'投稿数が減ってきていて、ピークを過ぎつつあります。', steady:'継続して投稿されている定番のワードです。' }[t.st] || '';

const CLIP_VIEWS = [{ id:'ch', label:'📺 チャンネル' }, { id:'vid', label:'🎬 動画' }];
const CLIP_RANGES = [
  { id:'all', label:'すべて',       min:0,   max:Infinity },
  { id:'s',   label:'〜1万人',      min:0,   max:1e4 },
  { id:'m',   label:'1万〜10万人',  min:1e4, max:1e5 },

const CLIP_FMTS = [{ id:'all', label:'すべて' }, { id:'video', label:'🎬 動画' }, { id:'short', label:'📱 ショート' }];
const CLIP_SORTS = { ch: [['subs','登録者数'],['views','合計再生（期間内）'],['n','動画の本数']], vid: [['views','再生数'],['ratio','伸び率（再生÷登録者）'],['new','新しい順']] };

    const v = V(id);

    if (chId) { if (v.chId === chId) out.push(v); continue; }
    if (C.fmt !== 'all' && v.fmt !== C.fmt) continue;
    if (!ignoreRange && C.range !== 'all' && (v.subs == null || v.subs < r.min || v.subs >= r.max)) continue;

  if (BM[kind][id]) { delete BM[kind][id]; toast('ブックマークを外しました'); }
  else {
    if (kind === 'v') { const v = V(id); if (!v) return; BM.v[id] = { id:v.id, title:v.title, ch:v.ch, chId:v.chId, subs:v.subs, views:v.views, likes:v.likes, comments:v.comments, published:v.published, dur:v.dur, stream:v.stream, live:v.live }; }
    else BM[kind][id] = 1;
    toast('★ 保存しました');
  }
  saveBM();
}

$$('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; S.kopen = null; store.set('vtb_tab2', S.tab); render(); window.scrollTo(0, 0); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 150); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],#mBack,[data-copy],[data-bm-v],[data-bm-arch],[data-bm-know],[data-genre],[data-format],[data-cap],[data-kwsrc],[data-kwgenre],[data-cttab],[data-ctgenre],[data-ctformat],[data-arch],[data-kcat],[data-kback],[data-kopen],[data-tok],[data-clipview],[data-cliprange],[data-clipfmt],[data-clipch],[data-gmode],[data-ggenre],[data-cgenre],[data-game],[data-classic],[data-vid]');
  if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) return closeModal();
  if (t.id === 'mBack') return backModal();
  if (d.copy !== undefined) { e.stopPropagation(); return copyText(d.copy, d.copymsg || 'URLをコピーしました'); }
  if (d.bmV !== undefined) {
    e.stopPropagation(); toggleBM('v', d.bmV);
    // ポップアウト内のボタンなら表示を更新（履歴は増やさない）
    if (!$('#modal').classList.contains('hidden') && t.closest('#modal')) {
      const v = V(d.bmV) || (BM.v[d.bmV] && enrich({ ...BM.v[d.bmV] }));
      if (v) { const html = videoModalHTML(v); mStack[mStack.length - 1] = [mStack[mStack.length - 1][0], html]; $('#mBody').innerHTML = html; }
    }
    return render();
  }
  if (d.bmArch !== undefined) { e.stopPropagation(); toggleBM('arch', d.bmArch); return render(); }
  if (d.bmKnow !== undefined) { e.stopPropagation(); toggleBM('know', d.bmKnow); return render(); }
  if (d.genre) { S.genre = d.genre; return render(); }
  if (d.format) { S.format = d.format; return render(); }
  if (d.cap) { S.cap = +d.cap; return render(); }
  if (d.kwsrc) { S.kw.src = d.kwsrc; return render(); }
  if (d.kwgenre) { S.kw.genre = d.kwgenre; return render(); }
  if (d.cttab) { S.ct.tab = d.cttab; return render(); }
  if (d.ctgenre) { S.ct.genre = d.ctgenre; return render(); }
  if (d.ctformat) { S.ct.format = d.ctformat; return render(); }
  if (d.arch) { S.arch[d.arch] = d.arch === 'year' && d.val !== 'all' ? +d.val : d.val; return render(); }
  if (d.kcat) { S.kcat = d.kcat; return render(); }
  if (d.kback !== undefined) { S.kopen = null; return render(); }
  if (d.kopen) { S.kopen = d.kopen; S.tab = 'know'; render(); return window.scrollTo(0, 0); }
  if (d.clipview) { S.clip.view = d.clipview; return render(); }
  if (d.cliprange) { S.clip.range = d.cliprange; return render(); }
  if (d.clipfmt) { S.clip.fmt = d.clipfmt; return render(); }
  if (d.clipch) return openClipCh(d.clipch);
  if (d.gmode) { S.ct.gmode = d.gmode; return render(); }
  if (d.ggenre) { S.ct.ggenre = d.ggenre; return render(); }
  if (d.cgenre) { S.ct.cgenre = d.cgenre; return render(); }
  if (d.game) return openGame(d.game);
  if (d.classic) return openClassic(d.classic);
  if (d.tok) return openToken(d.tok, d.tokg);
  if (d.vid) return openVideo(d.vid);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.set; if (!k) return;
  if (k === 'sort') S.sort = e.target.value;
  if (k === 'period') S.period = +e.target.value;
  if (k === 'archsort') S.arch.sort = e.target.value;
  if (k === 'clipsort') S.clip.sort = e.target.value;
  if (k === 'clipperiod') S.clip.period = +e.target.value;
  render();
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-selectall]')) e.target.select(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async () => {
  updateBMCount();
  await loadData();
  setMode(); render();
})();
</script>
</body>
</html>
