<style>
  :root { --bg:#f5f7fb; --fg:#1f2433; }

      linear-gradient(rgba(8,145,178,.05) 1px, transparent 1px),

    background-size: 32px 32px; }
  .glow { box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(8,145,178,.10); }

<body class="font-sans min-h-screen grid-bg">

<header class="sticky top-0 z-30 bg-void/90 backdrop-blur border-b border-line">

    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="ai" role="tab">🤖 AI分析</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="know" role="tab">🌐 ナレッジ</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="guide" role="tab">📖 使い方</button>

<main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-5 pb-20">

<!-- ポップアウト -->

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-panel border border-neon/40 text-sm rounded-full px-4 py-2 glow shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

<script>
/* =====================================================================
   0. ユーティリティ
   ===================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '億';
  if (n >= 1e4) return (n/1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,'') + '万';
  return Math.round(n).toLocaleString('ja-JP');
};
const DAY = 864e5;
const rtf = new Intl.RelativeTimeFormat('ja', { numeric:'auto' });
const ago = d => {
  const s = (d - Date.now()) / 1000, a = Math.abs(s);
  if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if (a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return rtf.format(Math.round(s/86400/30), 'month');
};
const ytSearchUrl = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
// タッチ端末（スマホ・タブレット）はリンクで開く。PCは埋め込み先でリンクがブロックされるのでコピー方式
const TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 1800);
}
async function copyText(text, msg = 'コピーしました') {
  try { await navigator.clipboard.writeText(text); return toast('📋 ' + msg); } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  toast(ok ? '📋 ' + msg : '下の欄を選択してコピーしてね');
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function median(a) { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
function spark(arr, w=72, h=22) {
  arr = (arr || []).filter(x => x != null);
  if (arr.length < 2) return '<span class="text-[10px] text-muted">推移データ蓄積中</span>';
  const min = Math.min(...arr), max = Math.max(...arr), r = max - min || 1;
  const pts = arr.map((v,i) => `${(i/(arr.length-1)*w).toFixed(1)},${(h - (v-min)/r*(h-4) - 2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${arr[arr.length-1] >= arr[0] ? '#16a34a' : '#db2777'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
/* リンク：スマホは開く、PCはURLとコピー */
function linkBox(url, label = 'YouTubeで開く') {
  const open = TOUCH ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="block text-center bg-neon text-white font-bold rounded-lg px-4 py-2.5 text-sm mb-2">▶ ${esc(label)}</a>` : '';
  return `${open}<div class="flex gap-2">
    <input readonly value="${esc(url)}" class="flex-1 min-w-0 bg-void border border-line rounded-lg px-2 py-2 text-xs font-mono" data-selectall>
    <button class="shrink-0 ${TOUCH ? 'border border-line' : 'bg-neon text-white'} font-bold rounded-lg px-3 text-xs" data-copy="${esc(url)}">📋 コピー</button>
  </div>`;
}
function miniLink(url, text) {
  return TOUCH
    ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="text-xs text-neon font-bold hover:underline">▶ ${esc(text)}</a>`
    : `<button class="text-xs text-neon font-bold hover:underline" data-copy="${esc(url)}" data-copymsg="URLをコピーしました">📋 ${esc(text)}のURLをコピー</button>`;
}

/* =====================================================================
   1. 定数・フィルター
   ===================================================================== */
// ジャンル（ホラーは最後）
const GENRES = [
  { id:'all',    label:'すべて' },
  { id:'game',   label:'ゲーム' },
  { id:'song',   label:'歌ってみた' },
  { id:'talk',   label:'雑談' },
  { id:'plan',   label:'企画' },
  { id:'horror', label:'ホラー' },
];
const GLABEL = Object.fromEntries(GENRES.map(g => [g.id, g.label]));
const FORMATS = [
  { id:'all',    label:'すべて' },
  { id:'video',  label:'🎬 動画' },
  { id:'stream', label:'🔴 配信' },
  { id:'short',  label:'📱 ショート' },
];
const FMT_LABEL = { video:'動画', stream:'配信', short:'ショート' };
const PERIODS = [{ id:7, label:'7日間' }, { id:28, label:'28日間' }];
const SORTS = [
  { id:'ratio',  label:'伸び率（再生÷登録者）' },
  { id:'views',  label:'再生数' },
  { id:'new',    label:'新しい順' },
  { id:'engage', label:'高評価率' },
];
// 登録者の絞り込み（20万人以上も含めて全部見られる）
// 1万人未満のチャンネルを細かく見られるように（初期表示は〜1万人）
const CAPS = [
  { id:'all', label:'すべて',     min:0,   max:Infinity },
  { id:'a1',  label:'〜1,000人',  min:0,   max:1e3 },
  { id:'a3',  label:'〜3,000人',  min:0,   max:3e3 },
  { id:'a5',  label:'〜5,000人',  min:0,   max:5e3 },
  { id:'s',   label:'〜1万人',    min:0,   max:1e4 },
  { id:'m',   label:'〜5万人',    min:0,   max:5e4 },
  { id:'xl',  label:'〜20万人',   min:0,   max:2e5 },
  { id:'big', label:'20万人以上', min:2e5, max:Infinity },
];
const ST = { new:['✨ 新登場','text-pink border-pink/40 bg-pink/10'], up:['🔥 急上昇','text-amber border-amber/40 bg-amber/10'], steady:['📈 継続中','text-neon border-neon/40 bg-neon/10'], down:['↘ 落ち着き','text-muted border-line bg-ink/5'] };

// 日本の動画だけ（ひらがな・カタカナがある、または音声が日本語）
const KANA = /[぀-ヿ]/;
const isJP = v => !!v && (KANA.test(v.title || '') || (/^ja/i.test(v.lang || '') && /[一-鿿]/.test(v.title || '')));
const isClip = v => /切り抜き|切抜き|きりぬき|clip|クリップ|全く度しが/i.test((v.title || '') + ' ' + (v.ch || ''));
// VTuberについて語る動画・関係ない動画（反応集・ニュース・講座・翻訳・健康系など）は外す
const META_BAD = /反応集|みんなの反応|に対する(みんな|ネット)|まとめ動画|考察|ニュース|語った|真意|VTuber(業界|市場)|業界|炎上|引退理由|元刑事|専門家|が解説|を解説する|解説してみた|ツボ|セルフケア|ストレッチ|ダイエット|占い|副業|投資|株価|仮想通貨|英会話|アンチ|賠償|特定され|訴訟|裁判|逮捕|暴露|謝罪|ゆっくり解説|2ch|5ch|面白いスレ|翻訳|翻譯|中文|精華|精华|中字|伸ばす方法|やるべきこと|講座|オーディション|魂募集|採用担当|入門|作業用BGM|ZIP!|インタビュー|VTuberはなぜ|(女性|男性)?VTuberの(リアル|顔|身長|下着|コスプレ|モテ|同棲|事情)|VTuberに(投稿頻度|聞いたら)/i;
// 解説・ニュース・翻訳・まとめ系のチャンネル
const CH_BAD = /解説|分析|ニュース|速報|まとめ|翻訳|ゆっくり|2ch|5ch|日テレ|テレビ|構造|の先生|せんせー|情報局|推し隊|つどいch|k1rq/i;
const HANGUL = /[가-힯]|[這們麼嗎妳裡們说们这么吗视频戏]|台V|台灣|中文/;
// VTuberを題材にした寸劇（#マイクラ より前の本文に「VTuber」が入っているもの）
const SKIT = { test: t => { t = String(t || '').normalize('NFKC'); if (!/#マイクラ|#minecraft/i.test(t)) return false; return /vtuber/i.test(t.split('#')[0]); } };
// ファンアート・依頼・AI生成・講座など、VTuber本人の活動ではないもの
const NOT_ACT = /fanmade|fan made|ファンアート|描かせて|描きます|有償依頼|依頼|発掘企画|ai生成|ai vtuber|aivtuber|裏の事情|vtuberは誰|howto|how to|初心者でもできる|mix講座/i;
const ACT = /配信|実況|プレイ|初見|耐久|参加型|コラボ|凸待ち|企画|歌枠|歌ってみた|cover|カバー|オリジナル曲|MV|雑談|朝活|作業|ASMR|お披露目|初配信|ホラー|ゲーム|ガチャ|ランクマ|RTA|縛り|検証|やってみた|チャレンジ|大会|踊ってみた|LIVE|ライブ|切り抜き|#shorts/i;
// AIの判定（data.json の aiv：1=残す / 0=外す）があればそれを優先、なければルールのフィルター
const isRelevant = v => { const a = S.data && S.data.aiv ? S.data.aiv[v.id] : undefined;
  if (a === 1) return isJP(v) && !HANGUL.test(v.title || ''); if (a === 0) return false; return ruleRelevant(v); };
const ruleRelevant = v => isJP(v) && !HANGUL.test(v.title || '') && !SKIT.test(v.title) && !NOT_ACT.test(String(v.title || '').normalize('NFKC')) && !META_BAD.test(v.title || '') && !CH_BAD.test(v.ch || '') && (ACT.test(v.title || '') || /【[^】]+】|《[^》]+》/.test(v.title || ''));
// 企画スタイル
const STYLES = [
  ['参加型', /参加型|視聴者参加|リスナー参加|参加OK/], ['コラボ', /コラボ|collab|ゲスト|w\/|×/i], ['耐久', /耐久|終われない|まで(寝|やめ|終わ)/],
  ['初見', /初見/], ['縛り・チャレンジ', /縛り|チャレンジ|RTA|ノーダメ|検証/], ['大会・対戦', /大会|カップ|トーナメント|対決|\bvs\b/i],
  ['歌枠', /歌枠|カラオケ/], ['雑談・マシュマロ', /雑談|マシュマロ|お悩み|相談/], ['ASMR', /ASMR|囁き/], ['同時視聴', /同時視聴|ミラー/],
  ['凸待ち', /凸待ち/], ['ガチャ・開封', /ガチャ|開封/], ['実況プレイ', /実況|プレイ|攻略/],
];
const styleOf = t => STYLES.filter(([, re]) => re.test(t || '')).map(([n]) => n);
const STOP = new Set(['vtuber','vtubers','新人vtuber','個人vtuber','vtuber準備中','新人vtuber準備中','shorts','short','ショート','切り抜き','ホロライブ','にじさんじ','hololive','nijisanji','ぶいすぽ','歌ってみた','cover','covered by','歌枠','雑談','雑談配信','ゲーム実況','実況','初見','初見プレイ','初見実況','ネタバレ注意','縦型配信','縦型','配信','live','ライブ配信','生配信','新人','おすすめ','fyp','viral','女性実況','男性vtuber','女性vtuber','vtuber好きと繋がりたい','jpvtuber','envtuber','music','mv','ゲーム','企画','shorts動画','youtube','youtubeshorts','ytshorts','trending','funny','anime','アニメ','live2d','3d','asmr配信','vsinger','個人勢','ゲーム配信','ホラーゲーム','ホラゲ']);
['ホラー','ホラゲー','ホラゲ実況','ホラーゲーム実況','音量注意','絶叫注意','閲覧注意','karaoke','singing','singingstream','twitch','steam','vlog','実況プレイ','ゲーム実況プレイ','歌い手','歌って','チャレンジ','罰ゲーム','pr','dance','イラスト','高音質','男性向け','女性向け','睡眠導入','寝息','吐息','心音','囁き','ear cleaning','耳かき','縦型','おもしろ','爆笑','バズれ','毎日投稿','毎日配信','初見さん大歓迎','初見さん歓迎','初見歓迎','朝活','夜活','手描き','animation','meme','ゲーム実況者','声真似','ネタバレあり','ネタバレ','作業用','睡眠用','高画質','4k','short動画','ショート動画','shortvideo','gaming','gameplay','vtuberclips','jpvtuber','vtuberjp'].forEach(w => STOP.add(w));
function tokenize(title) {
  const t = String(title || '').normalize('NFKC').replace(/[​-‏⁠﻿]/g, ''), out = new Map();
  const add = w => {
    w = w.replace(/^[\s#【】「」『』\[\]()（）〚〛《》:：]+|[\s#【】「」『』\[\]()（）〚〛《》:：]+$/g, '').replace(/\s+/g, ' ');
    const k = w.toLowerCase();
    if (w.length < 2 || w.length > 24 || /^[\d\s.\-#]+$/.test(w) || STOP.has(k) || /切り抜き$|vtuber$|^vtuber|vtuber準備|新人|個人勢|初見/.test(k)) return;
    if (!out.has(k)) out.set(k, w); };
  for (const m of t.matchAll(/【([^】]+)】/g)) m[1].split(/[\/|・,、#]+/).forEach(add);
  for (const m of t.matchAll(/『([^』]+)』/g)) add(m[1]);
  for (const m of t.matchAll(/#([^\s#【】]+)/g)) add(m[1]);
  return out;
}
// 「同じ人の同じ企画」を見分けるキー（チャンネル＋タイトル先頭の【】）
const contentKey = v => {

/* ジャンル × 形式 × 期間 × 登録者 で最大50件。同じ人の同じ企画は1本だけ。7日で足りないときは28日以内から補充 */
function buildList({ genre, format, period, cap = 'all', sort = 'ratio', minViews = 0, limit = 50 }) {

    && (!STRICT_G.has(genre) || GENRE_RE[genre].test(v.title))
    && (cap === 'all' || (v.subs != null && v.subs >= c.min && v.subs < c.max));

      const v = V(id); if (!v || seen.has(id) || (re && !re.test(v.title)) || (period === 7 && ageDays(v) > 28)) return;

const CLIP_VIEWS = [{ id:'ch', label:'📺 チャンネル' }, { id:'vid', label:'🎬 動画' }];
const CLIP_RANGES = [
  { id:'all', label:'すべて',       min:0,   max:Infinity },
  { id:'s',   label:'〜1万人',      min:0,   max:1e4 },
  { id:'m',   label:'1万〜10万人',  min:1e4, max:1e5 },
  { id:'l',   label:'10万〜50万人', min:1e5, max:5e5 },
  { id:'xl',  label:'50万人〜',     min:5e5, max:Infinity },
];
const CLIP_FMTS = [{ id:'all', label:'すべて' }, { id:'video', label:'🎬 動画' }, { id:'short', label:'📱 ショート' }];
const CLIP_SORTS = { ch: [{ id:'subs', label:'登録者数' }, { id:'views', label:'合計再生（期間内）' }, { id:'n', label:'動画の本数' }], vid: [{ id:'views', label:'再生数' }, { id:'ratio', label:'伸び率（再生÷登録者）' }, { id:'new', label:'新しい順' }] };
function clipVideos({ chId = null } = {}) {
  const C = S.clip, r = CLIP_RANGES.find(x => x.id === C.range), seen = new Set(), out = [];
  for (const ids of Object.values(S.data.pools)) for (const id of ids) {
    if (seen.has(id)) continue; seen.add(id);
    const v = V(id);
    if (!v || !isJP(v) || !isClip(v) || META_BAD.test(v.title) || ageDays(v) > C.period) continue;
    if (chId) { if (v.chId === chId) out.push(v); continue; }
    if (C.fmt !== 'all' && v.fmt !== C.fmt) continue;
    if (C.range !== 'all' && (v.subs == null || v.subs < r.min || v.subs >= r.max)) continue;
    if (!matchQ(v)) continue;
    out.push(v);
  }
  return out;
}
function clipChannels(vs) {
  const m = new Map();
  vs.forEach(v => { const c = m.get(v.chId) || { chId:v.chId, ch:v.ch, subs:v.subs, vids:[], views:0 }; c.vids.push(v); c.views += v.views; m.set(v.chId, c); });
  return [...m.values()].map(c => { c.vids.sort((a, b) => b.views - a.views); c.n = c.vids.length; return c; });
}
function renderClip() {
  const el = $('#view-clip'), C = S.clip;
  if (!CLIP_SORTS[C.view].some(s => s.id === C.sort)) C.sort = CLIP_SORTS[C.view][0].id;
  const vs = clipVideos();
  let body;
  if (C.view === 'ch') {
    const sortFn = { subs:(a,b) => (b.subs ?? -1) - (a.subs ?? -1), views:(a,b) => b.views - a.views, n:(a,b) => b.n - a.n }[C.sort];
    // 切り抜き専門チャンネルだけ（名前に「切り抜き」などがある、または切り抜き動画が3本以上）
    const chs = clipChannels(vs).filter(c => /切り抜き|切抜き|きりぬき|clip|クリップ/i.test(c.ch) || c.n >= 3).sort(sortFn).slice(0, 50);
    body = chs.length ? `<ol class="grid lg:grid-cols-2 gap-2">${chs.map((c, i) => `
      <li class="clickable bg-panel border border-line rounded-xl p-2 sm:p-3 flex gap-3 items-center min-w-0" data-clipch="${esc(c.chId)}">
        <span class="w-6 shrink-0 text-center font-mono font-bold ${i < 3 ? 'text-neon' : 'text-muted'}">${i + 1}</span>
        <div class="relative shrink-0">${thumbHTML(c.vids[0], 'w-24 sm:w-28 aspect-video rounded-lg')}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold truncate">${esc(c.ch)}</div>
          <div class="text-xs text-muted mt-0.5">登録者 <b class="text-ink font-mono">${fmt(c.subs)}</b>・${c.n}本・合計 ${fmt(c.views)}回</div>
          <div class="text-[11px] text-muted truncate mt-0.5">人気：${esc(c.vids[0].title)}</div>
        </div>
      </li>`).join('')}</ol>` : emptyBox('条件に合う切り抜きチャンネルがありません（切り抜きは3日かけて少しずつ貯まります）');
  } else {
    const list = vs.sort(SORTFN[C.sort]).slice(0, 50);
    body = list.length ? `<ol class="flex flex-col gap-2">${list.map((v, i) => videoRow(v, i)).join('')}</ol>` : emptyBox('条件に合う切り抜き動画がありません');
  }
  const nCh = new Set(vs.map(v => v.chId)).size;
  el.innerHTML = `
  <div class="bg-panel border border-line rounded-xl p-3 sm:p-4 mb-4">
    <div class="font-black">✂️ 切り抜きランキング</div>
    <div class="text-xs text-muted mt-0.5">VTuberの切り抜きチャンネル・動画をまとめています（トレンドには出しません）。直近${C.period}日で ${nCh}チャンネル・${vs.length}本。データは3日かけて少しずつ貯まります。</div>
  </div>
  <div class="flex flex-col gap-2.5 mb-4">
    ${seg(CLIP_VIEWS, C.view, 'data-clipview')}
    <div class="flex items-center gap-2 scroll-x -mx-3 px-3 sm:-mx-4 sm:px-4">${label('登録者')}${CLIP_RANGES.map(r => `<button class="${chipCls} !px-3 !text-xs" data-cliprange="${r.id}" aria-pressed="${C.range === r.id}">${r.label}</button>`).join('')}</div>
    ${seg(CLIP_FMTS, C.fmt, 'data-clipfmt')}
    <div class="flex flex-wrap items-center gap-2">${sel('clipsort', CLIP_SORTS[C.view], C.sort, '並び: ')}${sel('clipperiod', PERIODS, C.period, '期間: ')}</div>
  </div>
  ${body}`;
}

function kwTokens(g, f, p) {

    // 関係ない動画しか無いワード・チャンネル名（人名）・自己紹介タグ・区切りミスのワードは外す

      if (!t.top.length || [...tokenize('【' + t.w + '】').keys()].length !== 1) return false;
      return !t.top.every(id => { const c = nc(V(id).ch), w = nc(t.w); return w.length >= 2 && (c.includes(w) || w.includes(c)); }); })

  { id:'k11', cat:'edit', title:'見続けてもらえる動画編集：テンポ・テロップ・山場',
    summary:['いちばん効くのは「無音・間延び」のカット。テンポが上がるだけで最後まで見てもらいやすくなる','テロップは全部ではなく「笑いどころ・大事なところ」だけ。スマホで読める大きさで','切り抜きは「1本1つの話題」。冒頭にいちばん面白い瞬間を置く'],
    sections:[{ h:'カットとテンポ', p:'話していない時間、言い直し、ロード画面は思い切ってカットします。配信の切り抜きなら、元の配信の流れよりも「その場面だけで分かる」ことを優先します。' },
      { h:'テロップと効果音', p:'テロップはツッコミや大事なワードに絞ると、画面がうるさくなりません。スマホの小さい画面でも読める文字の大きさと縁取りにします。効果音は多すぎると疲れるので、山場に絞ります。' },

    src:[['動画編集のコツ','動画編集 コツ テンポ テロップ'],['切り抜きの作り方','切り抜き 動画 作り方 編集']] },
  { id:'k12', cat:'ai', title:'配信者のAI活用術：任せる作業と自分でやる作業',
    summary:['企画出し・タイトル案・概要欄など「たたき台づくり」はAIが得意','アーカイブの文字起こしから、チャプター・切り抜き候補・字幕を作ると作業が大きく減る','トークやキャラクターの個性は自分で。AIで作ったものの権利・ルールは必ず確認する'],
    sections:[{ h:'AIに任せやすい作業', p:'企画のアイデア出し、タイトル案を10個出してもらう、概要欄やSNS告知文の下書き、配信スケジュール画像の文面づくりなどは、AIにたたき台を作ってもらい、自分で直すのが効率的です。' },
      { h:'アーカイブの再活用', p:'配信の文字起こしをAIに読ませると、チャプター（目次）や「盛り上がった場面」の候補、ショートにできそうな部分を探してもらえます。字幕づくりや、海外向けの翻訳のたたき台にも使えます。' },

      { h:'ルールと権利の注意', p:'YouTubeでは、本物と見間違えるようなリアルな改変・合成コンテンツには、投稿時に開示（ラベル付け）が必要です。他人の声や絵をまねさせる使い方は避け、使うAIツールの利用規約（商用利用・収益化）も確認しておきましょう。' }],

// 基本記事（KNOW）とAIが毎日作る記事（notes）を1つの一覧にまとめる
function allNotes() {
  const base = KNOW.map(k => ({ id:k.id, cat:k.cat, title:k.title, summary:k.summary, sections:k.sections, forVtuber:[], base:true,
    sources: k.src.map(([n, q]) => ({ type:'search', title:n, url: ytSearchUrl(q), by:'YouTube検索' })), history:[], updated:'', created:'' }));
  const ai = (S.data.notes || []).slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
  return [...ai, ...base];
}
function noteBadge(n) {
  if (n.base) return '<span class="text-[10px] border border-line rounded px-1.5 py-0.5 text-muted">基本記事</span>';
  const edited = (n.history || []).length > 1;
  const d = (n.updated || '').slice(5).replace('-', '/');
  return edited ? `<span class="text-[10px] font-bold border border-amber/40 bg-amber/10 text-amber rounded px-1.5 py-0.5">✏️ 修正 ${esc(d)}</span>` : `<span class="text-[10px] font-bold border border-pink/40 bg-pink/10 text-pink rounded px-1.5 py-0.5">🆕 新規 ${esc(d)}</span>`;
}
// カテゴリのグループ（大きいボタン → 押すと中の項目がポップアウトで出る）

  const sections = cats.map(c => { const ns = all.filter(n => n.cat === c); return ns.length ? `

        ${sel.size ? `<div class="text-[11px] text-neon font-bold mt-0.5">${sel.size}個選択中・${cats.reduce((a, c) => a + cnt(c), 0)}本</div>` : ''}</div>

    </div>
    <div class="space-y-2.5">${groups.map(g => `
      <div class="sm:flex sm:items-start sm:gap-3">
        <div class="text-[11px] font-bold text-muted mb-1 sm:mb-0 sm:w-36 sm:shrink-0 sm:pt-1.5">${g.icon} ${esc(g.label)}</div>

    </div>

    </nav>
    <div class="min-w-0">
      <div class="bg-panel border border-line rounded-xl p-4 mb-4">
        <h1 class="font-black text-xl">📖 VTrend Base の使い方</h1>
        <p class="text-sm text-muted mt-1">章を押すと、その説明まで移動します。</p>
      </div>
      <div class="lg:hidden sticky top-[104px] z-20 -mx-3 px-3 py-2 bg-void/95 backdrop-blur border-b border-line mb-4">
        <div class="flex gap-2 scroll-x">${GUIDE.map((g, i) => `<button class="${chipCls} !px-3 !py-1 !text-xs" data-goto="${g.id}" aria-pressed="false">${i + 1}. ${g.icon} ${esc(g.title.replace(/（.*）/, ''))}</button>`).join('')}</div>
      </div>
      <div class="space-y-5">${GUIDE.map((g, i) => `
        <section id="${g.id}" class="bg-panel border border-line rounded-xl p-4 sm:p-5 scroll-mt-40">
          <h2 class="font-black text-lg mb-3"><span class="font-mono text-neon mr-1">${i + 1}.</span>${g.icon} ${esc(g.title)}</h2>
          <div class="${g.img ? 'md:grid md:grid-cols-[1fr_280px] gap-5' : ''}">
            <div class="text-sm leading-7 word-break">${g.body}</div>
            ${g.img ? `<figure class="mt-4 md:mt-0"><img src="${g.img}" alt="${esc(g.title)}の画面" loading="lazy" class="w-full max-w-[300px] mx-auto rounded-xl border border-line shadow-sm bg-line" onerror="this.closest('figure').style.display='none'"><figcaption class="text-[11px] text-muted text-center mt-1">画面の例（スマホ）</figcaption></figure>` : ''}
          </div>
        </section>`).join('')}</div>
    </div>
  </div>`;
  // 今読んでいる章を目次でハイライト
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(ents => ents.forEach(e => { if (e.isIntersecting) $$('[data-goto]').forEach(b => {
      const on = b.dataset.goto === e.target.id, bar = b.closest('.scroll-x');
      b.classList.toggle('bg-neon/10', on && !bar); b.classList.toggle('text-neon', on && !bar); b.setAttribute('aria-pressed', bar ? String(on) : 'false');
      // スマホの章ボタンは横方向だけスクロール（ページ全体は動かさない）
      if (on && bar) bar.scrollTo({ left: b.offsetLeft - bar.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' });
    }); }), { rootMargin: '-45% 0px -50% 0px' });
    GUIDE.forEach(g => { const s = document.getElementById(g.id); if (s) io.observe(s); });
  }
}

const mStack = [];
// スマホの「戻る」でポップアウトを閉じられるように、開いたときに履歴を1つ積む
let mHist = false;
window.addEventListener('popstate', () => { if (mHist) { mHist = false; mStack.length = 0; $('#modal').classList.add('hidden'); document.body.style.overflow = ''; } });
function openModal(title, html, push = true) {
  if (push) mStack.push([title, html]);
  if (!mHist) { try { history.pushState({ vtbModal: 1 }, ''); mHist = true; } catch (e) {} }
  $('#mTitle').textContent = title; $('#mBody').innerHTML = html;
  $('#mBack').classList.toggle('hidden', mStack.length < 2);
  $('#modal').classList.remove('hidden'); $('#modal .sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  mStack.length = 0; $('#modal').classList.add('hidden'); document.body.style.overflow = '';
  if (mHist) { mHist = false; try { history.back(); } catch (e) {} }
}
function backModal() { mStack.pop(); const t = mStack[mStack.length - 1]; if (t) openModal(t[0], t[1], false); else closeModal(); }
function stat(lbl, val, sub = '') { return `<div class="bg-void border border-line rounded-lg p-2 sm:p-2.5 min-w-0"><div class="text-[10px] text-muted truncate">${lbl}</div><div class="font-mono font-bold text-sm sm:text-base word-break">${val}</div>${sub ? `<div class="text-[10px] text-muted">${sub}</div>` : ''}</div>`; }
const durText = s => s >= 3600 ? `${Math.floor(s/3600)}時間${Math.round(s%3600/60)}分` : s >= 60 ? `${Math.round(s/60)}分` : `${s}秒`;
function openVideo(id) {
  const v = V(id); if (!v) return;
  const d = Math.max(ageDays(v), 0.05), ai = S.data.aiBuzz && S.data.aiBuzz[v.id];
  openModal(FMT_LABEL[v.fmt] + 'の詳細', `
    <div class="relative rounded-xl overflow-hidden mb-3">${thumbHTML(v, 'w-full aspect-video')}${fmtBadge(v, 'absolute top-2 left-2')}</div>
    <h2 class="font-black text-lg leading-snug mb-1 word-break">${esc(v.title)}</h2>
    <div class="text-sm text-muted mb-3">${esc(v.ch)}・登録者 ${fmt(v.subs)}・${ago(v.published)}</div>
    <div class="grid grid-cols-3 gap-2 mb-4">
      ${stat('再生数', fmt(v.views))}${stat('伸び率', v.ratio != null ? '×' + v.ratio.toFixed(1) : '—', '再生÷登録者')}${d < 1 ? stat('1時間あたり', fmt(v.views / Math.max(d * 24, 1)), '再生') : stat('1日あたり', fmt(v.views / d), '再生')}
      ${stat('高評価率', v.views ? (v.likes / v.views * 100).toFixed(1) + '%' : '—')}${stat('コメント率', v.views ? (v.comments / v.views * 100).toFixed(2) + '%' : '—')}${stat(v.live != null ? '同時接続' : '長さ', v.live != null ? fmt(v.live) : durText(v.dur))}
    </div>
    <h3 class="font-black mb-2">🔎 伸びた理由・経緯</h3>
    ${ai ? `<div class="bg-neon/5 border border-neon/30 rounded-xl p-3 mb-3"><div class="text-[10px] font-bold text-neon mb-1">AI分析（推定）</div><p class="text-sm leading-relaxed">${esc(ai)}</p></div>` : ''}
    <ul class="space-y-2 mb-4">${ruleReasons(v).map(([ic, h, p]) => `<li class="flex gap-3 bg-void border border-line rounded-lg p-3"><span class="text-xl leading-none">${ic}</span><div class="min-w-0"><div class="font-bold text-sm">${esc(h)}</div><p class="text-xs text-ink/75 leading-relaxed mt-0.5">${esc(p)}</p></div></li>`).join('')}</ul>
    <div class="flex items-center justify-between gap-2 mb-4 bg-void border border-line rounded-lg p-3"><div class="text-xs text-muted">チャンネル登録者推移</div>${spark(subsHist(v), 120, 28)}</div>
    <h3 class="font-black mb-2">🔗 リンク</h3>
    ${linkBox(v.url)}
    <div class="mt-2">${miniLink('https://www.youtube.com/channel/' + v.chId, 'チャンネル')}</div>`);
}

/* =====================================================================
   12. 画面切り替え・イベント
   ===================================================================== */
function render() {
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
  // スマホでは選択中のタブが見えるように、タブの列を横にスクロール
  const nav = $('header nav'), at = $('.tab[aria-selected="true"]');
  if (nav && at && (at.offsetLeft + at.offsetWidth > nav.scrollLeft + nav.clientWidth || at.offsetLeft < nav.scrollLeft)) nav.scrollLeft = at.offsetLeft - 16;
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + S.tab));
  ({ trend: renderTrend, ai: renderAI, clip: renderClip, words: renderWords, content: renderContent, know: renderKnow, guide: renderGuide })[S.tab]();
  // 横スクロールのボタン列は、選択中のボタンが見える位置まで自動でスクロール
  $$('.view:not(.hidden) .scroll-x').forEach(bar => { const on = bar.querySelector('[aria-pressed="true"]'); if (on && (on.offsetLeft + on.offsetWidth > bar.clientWidth || on.offsetLeft < bar.scrollLeft)) bar.scrollLeft = on.offsetLeft - 16; });
}
function setMode() {
  const live = S.mode === 'live';
  $('#modeLabel').textContent = live
    ? '更新 ' + new Date(S.data.updated).toLocaleString('ja-JP', { timeZone:'Asia/Tokyo', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    : 'SAMPLE';
  // 更新が36時間以上止まっているとき・サンプル表示のときはお知らせを出す
  const stale = live && Date.now() - new Date(S.data.updated) > 36 * 3600e3;
  $('#modeDot').className = 'w-2 h-2 rounded-full ' + (live && !stale ? 'bg-lime' : 'bg-amber');
  const n = $('#notice');
  n.textContent = !live ? '⚠️ データを読み込めなかったため、架空のサンプルデータを表示しています。時間をおいて再読み込みしてください。'
    : stale ? '⚠️ データの自動更新が止まっています（最終更新から1日以上）。表示している数字は少し古い可能性があります。' : '';
  n.classList.toggle('hidden', !n.textContent);
}
$$('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; S.kopen = null; store.set('vtb_tab3', S.tab); render(); window.scrollTo(0, 0); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); _titleIdx = null; S.chMore = 50; render(); }, 150); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-close],#mBack,[data-copy],[data-genre],[data-format],[data-cap],[data-kwsrc],[data-kwgenre],[data-kwformat],[data-kwperiod],[data-cttab],[data-arch],[data-archid],[data-more],[data-kcat],[data-tview],[data-chmore],[data-chan],[data-kback],[data-kopen],[data-tok],[data-clipview],[data-cliprange],[data-clipfmt],[data-clipch],[data-gmode],[data-ggenre],[data-cgenre],[data-game],[data-classic],[data-vid]');
  if (!t) return;
  const d = t.dataset;
  if (d.goto) { const s = document.getElementById(d.goto); if (s) { const off = (document.querySelector('header').offsetHeight || 100) + (window.innerWidth < 1024 ? 56 : 16); window.scrollTo({ top: s.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' }); } return; }
  if (d.close !== undefined) return closeModal();
  if (t.id === 'mBack') return backModal();
  if (d.copy !== undefined) { e.stopPropagation(); return copyText(d.copy, d.copymsg || 'URLをコピーしました'); }
  if (d.tview) { S.tview = d.tview; S.chMore = 50; return render(); }
  if (d.chmore) { S.chMore = Math.min(200, S.chMore + 50); return render(); }
  if (d.chan) return openChan(d.chan);
  if (d.genre) { S.genre = d.genre; S.chMore = 50; return render(); }
  if (d.format) { S.format = d.format; return render(); }
  if (d.cap) { S.cap = d.cap; S.chMore = 50; return render(); }
  if (d.kwsrc) { S.kw.src = d.kwsrc; return render(); }
  if (d.kwgenre) { S.kw.genre = d.kwgenre; return render(); }
  if (d.kwformat) { S.kw.format = d.kwformat; return render(); }
  if (d.kwperiod) { S.kw.period = +d.kwperiod; return render(); }
  if (d.cttab) { S.ct.tab = d.cttab; return render(); }
  if (d.arch) { S.arch[d.arch] = d.arch === 'year' && d.val !== 'all' ? +d.val : d.val; S.ct.more = 50; return render(); }
  if (d.archid) return openArch(d.archid);
  if (d.more) { S.ct.more += 50; return render(); }
  // 押すたびに選択／解除（複数選択）。「すべて」で解除
  if (d.kcat) { S.kcats = d.kcat === 'all' ? [] : S.kcats.includes(d.kcat) ? S.kcats.filter(c => c !== d.kcat) : [...S.kcats, d.kcat]; return render(); }
  if (d.kback !== undefined) { S.kopen = null; render(); return window.scrollTo(0, 0); }
  if (d.kopen) { S.kopen = d.kopen; S.tab = 'know'; render(); return window.scrollTo(0, 0); }
  if (d.tok) return openToken(d.tok);
  if (d.clipview) { S.clip.view = d.clipview; return render(); }
  if (d.cliprange) { S.clip.range = d.cliprange; return render(); }
  if (d.clipfmt) { S.clip.fmt = d.clipfmt; return render(); }
  if (d.clipch) return openClipCh(d.clipch);
  if (d.gmode) { S.ct.gmode = d.gmode; return render(); }
  if (d.ggenre) { S.ct.ggenre = d.ggenre; return render(); }
  if (d.cgenre) { S.ct.cgenre = d.cgenre; return render(); }
  if (d.game) return openGame(d.game);
  if (d.classic) return openClassic(d.classic);
  if (d.vid) return openVideo(d.vid);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.set; if (!k) return;
  if (k === 'sort') S.sort = e.target.value;
  if (k === 'period') S.period = +e.target.value;
  if (k === 'archsort') S.arch.sort = e.target.value;
  if (k === 'clipsort') S.clip.sort = e.target.value;
  if (k === 'clipperiod') S.clip.period = +e.target.value;
  if (k === 'aiidx') S.aiIdx = +e.target.value;
  render();
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-selectall]')) e.target.select(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async () => {
  await loadData();
  setMode(); render();
})();
</script>
</body>
</html>
