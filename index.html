<style>
  :root { --bg:#f5f7fb; --fg:#1f2433; }
  html, body { max-width:100%; overflow-x:clip; }
  body { background:var(--bg); color:var(--fg); -webkit-text-size-adjust:100%; }
  .grid-bg { background-image:
      linear-gradient(rgba(8,145,178,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(8,145,178,.05) 1px, transparent 1px);
    background-size: 32px 32px; }
  .glow { box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(8,145,178,.10); }
  .glow-pink { box-shadow: 0 0 0 1px rgba(219,39,119,.35), 0 4px 16px rgba(219,39,119,.12); }

  .chip[aria-pressed="true"] { background:#0891b2; color:#fff; border-color:#0891b2; box-shadow:0 2px 8px rgba(8,145,178,.25); }

  .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

<body class="font-sans min-h-screen grid-bg">

<header class="sticky top-0 z-30 bg-void/90 backdrop-blur border-b border-line">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 pt-3 flex items-center gap-2 sm:gap-3">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon to-pink grid place-items-center font-black text-white">V</div>
      <div class="leading-tight hidden md:block">
        <div class="font-black tracking-wide">VTrend <span class="text-neon">Base</span></div>
        <div class="text-[10px] text-muted font-mono">JP TREND INTELLIGENCE</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-panel border border-neon/40 text-sm rounded-full px-4 py-2 glow shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

<script>
/* =====================================================================
   0. ユーティリティ
   ===================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '億';
  if (n >= 1e4) return (n/1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,'') + '万';
  return Math.round(n).toLocaleString('ja-JP');
};
const DAY = 864e5;
const rtf = new Intl.RelativeTimeFormat('ja', { numeric:'auto' });
const ago = d => {
  const s = (d - Date.now()) / 1000, a = Math.abs(s);
  if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if (a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return rtf.format(Math.round(s/86400/30), 'month');
};
const ytSearchUrl = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
// リンクは、スマホでもPCでも、Wixの埋め込みの中でも「押したら開く」にする。
// 埋め込みの中で新しいタブがブロックされたときだけ、代わりにURLをコピーして知らせる（下の a[target=_blank] のクリック処理）
const IN_FRAME = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
const TOUCH = true;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 1800);
}
async function copyText(text, msg = 'コピーしました') {
  try { await navigator.clipboard.writeText(text); return toast('📋 ' + msg); } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  toast(ok ? '📋 ' + msg : '下の欄を選択してコピーしてね');
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function median(a) { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
function spark(arr, w=72, h=22) {
  arr = (arr || []).filter(x => x != null);
  if (arr.length < 2) return '<span class="text-[10px] text-muted">推移データ蓄積中</span>';
  const min = Math.min(...arr), max = Math.max(...arr), r = max - min || 1;
  const pts = arr.map((v,i) => `${(i/(arr.length-1)*w).toFixed(1)},${(h - (v-min)/r*(h-4) - 2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${arr[arr.length-1] >= arr[0] ? '#16a34a' : '#db2777'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
/* リンク：スマホは開く、PCはURLとコピー */
function linkBox(url, label = 'YouTubeで開く') {
  const open = TOUCH ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="block text-center bg-neon text-white font-bold rounded-lg px-4 py-2.5 text-sm mb-2">▶ ${esc(label)}</a>` : '';
  return `${open}<div class="flex gap-2">
    <input readonly value="${esc(url)}" class="flex-1 min-w-0 bg-void border border-line rounded-lg px-2 py-2 text-xs font-mono" data-selectall>
    <button class="shrink-0 ${TOUCH ? 'border border-line' : 'bg-neon text-white'} font-bold rounded-lg px-3 text-xs" data-copy="${esc(url)}">📋 コピー</button>
  </div>`;
}
function miniLink(url, text) {
  return TOUCH
    ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="text-xs text-neon font-bold hover:underline">▶ ${esc(text)}</a>`
    : `<button class="text-xs text-neon font-bold hover:underline" data-copy="${esc(url)}" data-copymsg="URLをコピーしました">📋 ${esc(text)}のURLをコピー</button>`;
}

/* =====================================================================
   1. 定数・フィルター
   ===================================================================== */
// ジャンル（ホラーは最後）
const GENRES = [
  { id:'all',    label:'すべて' },
  { id:'game',   label:'ゲーム' },
  { id:'song',   label:'歌ってみた' },
  { id:'talk',   label:'雑談' },
  { id:'plan',   label:'企画' },
  { id:'horror', label:'ホラー' },
];
const GLABEL = Object.fromEntries(GENRES.map(g => [g.id, g.label]));
const FORMATS = [
  { id:'all',    label:'すべて' },
  { id:'video',  label:'🎬 動画' },
  { id:'stream', label:'🔴 配信' },
  { id:'short',  label:'📱 ショート' },
];
const FMT_LABEL = { video:'動画', stream:'配信', short:'ショート' };
const PERIODS = [{ id:7, label:'7日間' }, { id:28, label:'28日間' }];
const SORTS = [
  { id:'ratio',  label:'伸び率（再生÷登録者）' },
  { id:'views',  label:'再生数' },
  { id:'new',    label:'新しい順' },
  { id:'engage', label:'高評価率' },
];
// 登録者の絞り込み（20万人以上も含めて全部見られる）
// 1万人未満のチャンネルを細かく見られるように（初期表示は〜1万人）
const CAPS = [
  { id:'all', label:'すべて',     min:0,   max:Infinity },
  { id:'a1',  label:'〜1,000人',  min:0,   max:1e3 },
  { id:'a3',  label:'〜3,000人',  min:0,   max:3e3 },
  { id:'a5',  label:'〜5,000人',  min:0,   max:5e3 },
  { id:'s',   label:'〜1万人',    min:0,   max:1e4 },
  { id:'m',   label:'〜5万人',    min:0,   max:5e4 },
  { id:'xl',  label:'〜20万人',   min:0,   max:2e5 },
  { id:'big', label:'20万人以上', min:2e5, max:Infinity },
];
const ST = { new:['✨ 新登場','text-pink border-pink/40 bg-pink/10'], up:['🔥 急上昇','text-amber border-amber/40 bg-amber/10'], steady:['📈 継続中','text-neon border-neon/40 bg-neon/10'], down:['↘ 落ち着き','text-muted border-line bg-ink/5'] };

// 日本の動画だけ（ひらがな・カタカナがある、または音声が日本語）
const KANA = /[぀-ヿ]/;
const isJP = v => !!v && (KANA.test(v.title || '') || (/^ja/i.test(v.lang || '') && /[一-鿿]/.test(v.title || '')));
const isClip = v => /切り抜き|切抜き|きりぬき|clip|クリップ|全く度しが/i.test((v.title || '') + ' ' + (v.ch || ''));
// VTuberについて語る動画・関係ない動画（反応集・ニュース・講座・翻訳・健康系など）は外す
const META_BAD = /反応集|みんなの反応|に対する(みんな|ネット)|まとめ動画|考察|ニュース|語った|真意|VTuber(業界|市場)|業界|炎上|引退理由|元刑事|専門家|が解説|を解説する|解説してみた|ツボ|セルフケア|ストレッチ|ダイエット|占い|副業|投資|株価|仮想通貨|英会話|アンチ|賠償|特定され|訴訟|裁判|逮捕|暴露|謝罪|ゆっくり解説|2ch|5ch|面白いスレ|翻訳|翻譯|中文|精華|精华|中字|伸ばす方法|やるべきこと|講座|オーディション|魂募集|採用担当|入門|作業用BGM|ZIP!|インタビュー|VTuberはなぜ|(女性|男性)?VTuberの(リアル|顔|身長|下着|コスプレ|モテ|同棲|事情)|VTuberに(投稿頻度|聞いたら)/i;
// 解説・ニュース・翻訳・まとめ系のチャンネル
const CH_BAD = /解説|分析|ニュース|速報|まとめ|翻訳|ゆっくり|2ch|5ch|日テレ|テレビ|構造|の先生|せんせー|情報局|推し隊|つどいch|k1rq/i;
const HANGUL = /[가-힯]|[這們麼嗎妳裡們说们这么吗视频戏]|台V|台灣|中文/;
// VTuberを題材にした寸劇（#マイクラ より前の本文に「VTuber」が入っているもの）
const SKIT = { test: t => { t = String(t || '').normalize('NFKC'); if (!/#マイクラ|#minecraft/i.test(t)) return false; return /vtuber/i.test(t.split('#')[0]); } };
// ファンアート・依頼・AI生成・講座など、VTuber本人の活動ではないもの
const NOT_ACT = /fanmade|fan made|ファンアート|描かせて|描きます|有償依頼|依頼|発掘企画|ai生成|ai vtuber|aivtuber|裏の事情|vtuberは誰|howto|how to|初心者でもできる|mix講座/i;
const ACT = /配信|実況|プレイ|初見|耐久|参加型|コラボ|凸待ち|企画|歌枠|歌ってみた|cover|カバー|オリジナル曲|MV|雑談|朝活|作業|ASMR|お披露目|初配信|ホラー|ゲーム|ガチャ|ランクマ|RTA|縛り|検証|やってみた|チャレンジ|大会|踊ってみた|LIVE|ライブ|切り抜き|#shorts/i;
// AIの判定（data.json の aiv：1=残す / 0=外す）があればそれを優先、なければルールのフィルター
const isRelevant = v => { const a = S.data && S.data.aiv ? S.data.aiv[v.id] : undefined;
  if (a === 1) return isJP(v) && !HANGUL.test(v.title || ''); if (a === 0) return false; return ruleRelevant(v); };
const ruleRelevant = v => isJP(v) && !HANGUL.test(v.title || '') && !SKIT.test(v.title) && !NOT_ACT.test(String(v.title || '').normalize('NFKC')) && !META_BAD.test(v.title || '') && !CH_BAD.test(v.ch || '') && (ACT.test(v.title || '') || /【[^】]+】|《[^》]+》/.test(v.title || ''));
// 企画スタイル
const STYLES = [
  ['参加型', /参加型|視聴者参加|リスナー参加|参加OK/], ['コラボ', /コラボ|collab|ゲスト|w\/|×/i], ['耐久', /耐久|終われない|まで(寝|やめ|終わ)/],
  ['初見', /初見/], ['縛り・チャレンジ', /縛り|チャレンジ|RTA|ノーダメ|検証/], ['大会・対戦', /大会|カップ|トーナメント|対決|\bvs\b/i],
  ['歌枠', /歌枠|カラオケ/], ['雑談・マシュマロ', /雑談|マシュマロ|お悩み|相談/], ['ASMR', /ASMR|囁き/], ['同時視聴', /同時視聴|ミラー/],
  ['凸待ち', /凸待ち/], ['ガチャ・開封', /ガチャ|開封/], ['実況プレイ', /実況|プレイ|攻略/],
];

    sections:[{ h:'何が起きているか', p:'ホーム・関連動画・検索など表示される場所ごとに、「この人はこの動画を見て満足しそうか」を予測して表示しています。YouTube公式チャンネル（Creator Insider など）では、クリックや視聴時間だけでなく、視聴後アンケートや「興味なし」、高評価なども満足度の手がかりになると説明されています。' },

      { h:'見るべき数字', p:'Studioの「リーチ」で、インプレッション → クリック率 → 平均視聴時間の流れを確認します。インプレッションが急に増えたときにクリック率が下がるのは普通で、新しい層に表示され始めたサインです。' }],
    src:[['Creator Insider','Creator Insider algorithm'],['YouTube Creators','YouTube Creators how the algorithm works']] },
  { id:'k2', cat:'algo', title:'冒頭30秒とリテンショングラフの読み方',
    summary:['離脱が最も多いのは冒頭。最初の30秒で「この動画で得られるもの」を約束する','グラフの急落＝期待とのズレ、平坦＝満足、山＝見返されている名場面','山の部分はそのままショートや切り抜きの素材になる'],
    sections:[{ h:'海外での定説', p:'YouTubeストラテジストの Paddy Galloway らの分析動画や、MrBeast の制作チーム向けドキュメントでは、冒頭の数十秒で視聴者の期待に応えることが最重要だと繰り返し強調されています。' },
      { h:'グラフの見方', p:'急な落ち込みは「サムネ・タイトルの期待と中身がズレた」地点。なだらかな横ばいは満足して見ている状態。グラフが盛り上がる山は、巻き戻して見返されている場所です。' },
      { h:'配信者向けの実践', p:'アーカイブの待機画面や長い挨拶はカットするか、冒頭に「今日のハイライト」を10秒入れて山場を予告します。山の部分は切り抜き・ショートにすると、すでに証明された面白さを再利用できます。' }],
    src:[['Paddy Galloway','Paddy Galloway retention'],['MrBeast','MrBeast how to succeed retention']] },
  { id:'k3', cat:'thumb', title:'タイトルとサムネは「1つのアイデア」を分担して伝える',
    summary:['サムネとタイトルで同じ言葉を繰り返さず、互いに補い合う','サムネの要素は3つまで。スマホの小さい表示で読めるかを必ず確認','YouTubeの「テストと比較」機能でサムネをA/Bテストできる'],
    sections:[{ h:'考え方', p:'Film Booth などのサムネ・タイトル解説で共通するのは「サムネで状況を見せ、タイトルで続きが気になる一言を足す」という分担です。同じ文字をサムネとタイトルの両方に書くと、情報量が半分になります。' },

      { h:'検証する', p:'YouTube Studio の「テストと比較」でサムネを複数登録すると、どれが長く見られたかを自動で比較してくれます。感覚ではなく結果で選ぶ習慣を付けましょう。' }],

  { id:'k4', cat:'thumb', title:'企画はサムネとタイトルから先に考える',
    summary:['海外トップ勢は「撮る前にパッケージ（サムネ＋タイトル）を決める」ことが多い','パッケージが思いつかない企画は、内容が良くてもクリックされにくい','配信も「タイトルを先に決めてから企画を詰める」だけで枠の魅力が上がる'],
    sections:[{ h:'パッケージ先行', p:'Colin and Samir のインタビューや MrBeast の発言で繰り返し語られるのが「パッケージから企画を作る」発想です。一目で分かる面白さがある企画だけを実行することで、外れ回を減らします。' },
      { h:'配信への応用', p:'「【ホラー】叫んだら即終了」のように、タイトルにルールや賭けを入れると「どうなるか見たい」という理由が生まれます。毎回の配信タイトルを3案出して、一番クリックしたくなるものを選ぶだけでも効果があります。' }],

  { id:'k5', cat:'short', title:'ショートは最初の1秒とループで決まる',
    summary:['イントロ・挨拶は不要。1秒目から本題（オチの手前）を見せる','最後が最初につながる「ループ構成」は再視聴を生みやすい','Studioの「視聴された / スワイプされた」割合が最重要の通信簿'],
    sections:[{ h:'構成', p:'ショート専門で知られる Jenny Hoyos などは、台本を極限まで削り、1秒目から状況が分かる構成を推奨しています。「どうも〇〇です」は配信では大事でも、ショートではスワイプの原因になります。' },
      { h:'尺について', p:'ショートは最大3分まで投稿できるようになりましたが、伸びやすいのは「必要な分だけ」の短い尺です。まず15〜40秒で山場1つ、を基本にしましょう。' },
      { h:'確認する数字', p:'Studioのショート分析には「視聴された」と「スワイプされた」の割合が表示されます。ここが改善すれば表示回数も伸びていきます。' }],

  { id:'k6', cat:'short', title:'ショートから長尺・配信へ視聴者を連れていく',
    summary:['ショートの視聴者は、長尺・配信の視聴者と別の層になりやすい','ショートに「関連動画」を設定して、本編アーカイブへの導線を作る','シリーズ化して「この人のショートの続きが見たい」状態を作る'],
    sections:[{ h:'よくある失敗', p:'ショートが伸びても登録者や配信の同接が増えない、というのは海外でもよく語られる悩みです。原因は、ショート単体で完結していて「次に見るもの」がないことです。' },
      { h:'導線の作り方', p:'ショートの編集画面で「関連動画」に元配信のアーカイブを設定すると、ショートの下にリンクが表示されます。配信の名場面ショート → フル配信、という流れを毎回作りましょう。' },

  { id:'k7', cat:'mental', title:'数字に振り回されないために、見る指標を絞る',
    summary:['毎日アナリティクスを見るより、週1回の振り返り時間を決める','比較対象は他人ではなく「自分の直近10本」','燃え尽きは海外の大手クリエイターも公に語るテーマ。休む予定も配信スケジュールに入れる'],
    sections:[{ h:'自分と比べる', p:'Studioには「通常のパフォーマンス」との比較表示があり、自分の普段の動画と比べて良いか悪いかが分かります。他人の数字と比べるより、改善点がはっきりします。' },
      { h:'燃え尽き対策', p:'Ali Abdaal や Colin and Samir の番組でも、多くのクリエイターがバーンアウト経験を語っています。共通する対策は「休みを先に予定に入れる」「数字を見る日を決める」「作る楽しさを残す」の3つです。' }],

  { id:'k8', cat:'live', title:'リスナーを「常連」に変える運用',
    summary:['固定スケジュールは最強のリスナー維持施策。曜日と時間を固定して告知する','コメントやメンバーの名前を呼ぶなど「見つけてもらえた感覚」を作る','配信外はコミュニティ投稿・Discord・ショートで接点を保つ'],
    sections:[{ h:'習慣になる配信', p:'海外のストリーマーやVTuberの成長解説で必ず出てくるのが「スケジュールの固定」です。「火曜21時はこの人」と覚えてもらえると、通知がなくても来てくれるようになります。' },
      { h:'参加している感覚', p:'初見さんへの挨拶、常連の名前を呼ぶ、マシュマロや質問を拾う。小さな配信ほど、一人ひとりを認識できることが最大の強みになります。' },
      { h:'配信外の接点', p:'週間スケジュールをコミュニティ投稿で出す、配信の切り抜きショートを出す、Discordで次回の企画アンケートを取る、など配信がない日もつながりを保ちます。' }],
    src:[['海外VTuber・ストリーマーの成長解説','how to grow as a VTuber tips'],['vidIQ','vidIQ live stream grow']] },
  { id:'k9', cat:'talk', title:'雑談で沈黙しないための「ネタ帳」と「話の型」',
    summary:['話がうまい人は、その場で考えているのではなく話題をストックしている','「結論 → エピソード → リスナーへの質問」の型で話すと、短くても伝わり、コメントも来やすい','自分の配信アーカイブを見返すのが、いちばん効く練習'],
    sections:[{ h:'ネタ帳を作る', p:'日常で「ちょっと面白かった」「腹が立った」「びっくりした」ことを、スマホのメモにその場で1行だけ書いておきます。配信前にそこから3つ選んでおくだけで、話題がなくて黙ってしまう時間がぐっと減ります。' },
      { h:'話の型', p:'「今日〇〇があってさ（結論）」→「実は〜で、〜だったの（エピソード）」→「みんなはこういうことある？（質問）」の順で話すと、話が長くなりすぎず、リスナーもコメントしやすくなります。最後を質問で終えるのがコツです。' },
      { h:'コメントの拾い方', p:'コメントを読むときは「名前＋内容＋自分の感想や質問返し」の3点セットにすると、読み上げるだけで終わらず会話になります。初見さんには、どこから来てくれたかを聞くと話が広がります。' },
      { h:'練習方法', p:'自分のアーカイブを1.5倍速で見返して、間が空いたところ・同じ口ぐせが続くところをメモします。ほかに、ゲームをしながら独り言で実況する、お題を決めて1分話す、などは配信外でもできる練習です。' }],
    src:[['配信者のトーク術','配信 トーク力 鍛え方'],['雑談配信のコツ','雑談配信 話題 コツ']] },
  { id:'k10', cat:'obs', title:'OBSの基本設定：最初にここだけ押さえる',
    summary:['ビットレートなどの数字は、YouTube公式ヘルプの「ライブエンコーダの設定」の推奨値に合わせる','キーフレーム間隔は2秒、音声のサンプルレートはOBS・マイク・PCでそろえる','本番前に「限定公開」でテスト配信して、映像と音を必ず確認する'],
    sections:[{ h:'出力の設定', p:'解像度・フレームレートごとの推奨ビットレートは、YouTube公式ヘルプの「ライブエンコーダの設定、ビットレート、解像度を選択する」にまとまっています。キーフレーム間隔は2秒（OBSでは「2」）にします。グラフィックボード（NVIDIA・AMDなど）のエンコーダーを使うと、ゲームが重くなりにくくなります。' },
      { h:'音の設定', p:'マイクの音声フィルタに「ノイズ抑制」「ノイズゲート」「コンプレッサー」「リミッター」を順に入れるのが定番です。音がプツプツ途切れるときは、OBSとWindowsのマイク設定のサンプルレート（48kHzなど）がそろっているか確認します。' },
      { h:'VTuberの立ち絵・モデル', p:'トラッキングソフトの画面は、ゲームキャプチャやウィンドウキャプチャで取り込み、背景を透過します。ソフトによっては透過したまま直接OBSに送れる機能（Spoutなど）もあります。' },
      { h:'よくあるトラブル', p:'OBSの「統計」画面で、「エンコードのラグ」でフレームが落ちているならPCの負荷（解像度・フレームレートを下げる）、「ネットワーク」で落ちているなら回線（有線LANにする・ビットレートを下げる）が原因です。' }],
    src:[['YouTube公式ヘルプ','YouTube ライブエンコーダ 設定 ビットレート'],['OBS設定の解説','OBS 配信 設定 おすすめ']] },
  { id:'k11', cat:'edit', title:'見続けてもらえる動画編集：テンポ・テロップ・山場',
    summary:['いちばん効くのは「無音・間延び」のカット。テンポが上がるだけで最後まで見てもらいやすくなる','テロップは全部ではなく「笑いどころ・大事なところ」だけ。スマホで読める大きさで','切り抜きは「1本1つの話題」。冒頭にいちばん面白い瞬間を置く'],
    sections:[{ h:'カットとテンポ', p:'話していない時間、言い直し、ロード画面は思い切ってカットします。配信の切り抜きなら、元の配信の流れよりも「その場面だけで分かる」ことを優先します。' },
      { h:'テロップと効果音', p:'テロップはツッコミや大事なワードに絞ると、画面がうるさくなりません。スマホの小さい画面でも読める文字の大きさと縁取りにします。効果音は多すぎると疲れるので、山場に絞ります。' },
      { h:'冒頭と構成', p:'冒頭の数秒で「この動画で何が起きるか」が分かるようにします。いちばん面白い瞬間を冒頭に少しだけ見せてから本編に入る構成は、切り抜きやショートでよく使われます。' },
      { h:'時短の工夫', p:'テロップや効果音、オープニングはテンプレートにしておくと毎回の作業が速くなります。DaVinci Resolve や CapCut などの自動文字起こし機能で字幕のたたき台を作ると、テロップ入れの時間を減らせます。BGM・効果音は利用規約（商用・収益化OKか）を必ず確認しましょう。' }],
    src:[['動画編集のコツ','動画編集 コツ テンポ テロップ'],['切り抜きの作り方','切り抜き 動画 作り方 編集']] },
  { id:'k12', cat:'ai', title:'配信者のAI活用術：任せる作業と自分でやる作業',
    summary:['企画出し・タイトル案・概要欄など「たたき台づくり」はAIが得意','アーカイブの文字起こしから、チャプター・切り抜き候補・字幕を作ると作業が大きく減る','トークやキャラクターの個性は自分で。AIで作ったものの権利・ルールは必ず確認する'],
    sections:[{ h:'AIに任せやすい作業', p:'企画のアイデア出し、タイトル案を10個出してもらう、概要欄やSNS告知文の下書き、配信スケジュール画像の文面づくりなどは、AIにたたき台を作ってもらい、自分で直すのが効率的です。' },
      { h:'アーカイブの再活用', p:'配信の文字起こしをAIに読ませると、チャプター（目次）や「盛り上がった場面」の候補、ショートにできそうな部分を探してもらえます。字幕づくりや、海外向けの翻訳のたたき台にも使えます。' },
      { h:'自分でやるべきこと', p:'リスナーとのやり取り、トーク、キャラクターらしさはAIに任せないほうが、ファンとの関係が深まります。AIが出した情報（ゲームの攻略・ニュースなど）は間違っていることもあるので、配信で話す前に確認しましょう。' },
      { h:'ルールと権利の注意', p:'YouTubeでは、本物と見間違えるようなリアルな改変・合成コンテンツには、投稿時に開示（ラベル付け）が必要です。他人の声や絵をまねさせる使い方は避け、使うAIツールの利用規約（商用利用・収益化）も確認しておきましょう。' }],
    src:[['クリエイターのAI活用','how YouTubers use AI tools workflow'],['配信者のAI活用','配信者 AI 活用']] },

      <li>配信の中身の分析は、毎日の自動更新でAI（Gemini）が映像を30分ずつ見て、5分ごとに書いています。1日に分析できる量に限りがあるので、新しい配信から順に少しずつ進みます。</li>
      <li>限定公開・非公開の動画は出ません。メンバー限定は「👑」が付きます。</li></ul>
    <h3 class="font-black mt-4 mb-1">📊 数字（ログインすると見られます）</h3>
    <ul class="list-disc pl-5 space-y-1">
      <li>いちばん上の<b>🩺 健康診断</b>で、大事な数字が「良い・ふつう・要改善」の色で一目で分かります。その下の「🔧 直すならここから」を上から順に直すのが近道です。</li>
      <li>そのあとは、視聴者が通る順番で並んでいます：<b>①見つけてもらう（インプレッション・どこから来たか・検索キーワード） → ②押してもらう（クリック率） → ③見続けてもらう（平均視聴率） → ④反応してもらう（高評価・コメント・共有・同接） → ⑤ファンになってもらう（登録者）</b> → 👥視聴者 → 📈毎日の推移 → 🎬動画ごと。</li>
      <li>目安は、攻略サイトでよく使われる値と、VTrend Baseが集めた登録者1万人未満のVTuberの数字です。比べる相手は<b>自分の前の期間</b>がいちばん確実です（ナレッジ「アナリティクスは…の順で見る」）。</li>
      <li>ログインしていないときは、公開されている数字（再生・高評価・日時）から分かることを出します。</li></ul>
    <h3 class="font-black mt-4 mb-1">📝 自己プロデュース</h3>
    <ul class="list-disc pl-5 space-y-1">
      <li>方針・活動頻度・戦略・目標・ペルソナ・その他を書くと、AIが「実際の数字とずれていないか」「書いた内容が今のままでいいか」も評価します。入力すると自動で保存されます。</li>
      <li><b>⭐ 参考にしているチャンネル</b>はいくつでも追加でき、「何を参考にしているか」の一言とメモを残せます。選ぶなら同じジャンル・登録者が自分の1〜3倍くらいのチャンネルがおすすめです（ナレッジ「参考にするチャンネルの選び方」）。</li>
      <li>「📋 AIへの依頼文を作る」を押すと、ここに書いた内容と数字をまとめた文章ができます。コピーしてAIに貼り付けると、くわしい評価をもらえます。</li></ul>` },
  { id:'g-trend', icon:'📈', title:'トレンド', img:'guide/trend.jpg', body:`
    <p>今伸びている<b>動画</b>と<b>VTuberチャンネル</b>のランキングです。いちばん上のボタンで<b>「🎬 動画ランキング」と「📺 チャンネルランキング」</b>を切り替えます。どちらも<b>登録者</b>（最初は「〜1万人」）と<b>ジャンル</b>（すべて／ゲーム／歌ってみた／雑談／企画／ホラー）で絞り込めます。〜1,000人／〜3,000人／〜5,000人と細かく絞ると、自分に近い規模で伸びている人が見つかります。</p>
    <h3 class="font-black mt-4 mb-1">🎬 動画ランキング</h3>
    <ol class="list-decimal pl-5 space-y-1">
      <li><b>形式</b>：すべて／動画／配信（アーカイブ）／ショート。それぞれ最大50件で、ボタンの横の数字が件数です。ショートは「YouTubeショートとして投稿されたもの」だけで、3分以内でも普通の動画（歌ってみた・MVなど）は「動画」に入ります。</li>
      <li><b>並び</b>：伸び率（再生数÷登録者数）／再生数／新しい順／高評価率。伸び率順にすると、登録者が少ないのにバズった企画が見つかります。</li>
      <li><b>期間</b>：7日間／28日間。7日間で50件に足りないときは、28日以内の動画から補充します（「補充」と表示）。</li>
      <li><b>上の4つの数字</b>：今のリストの平均再生数・伸び率の中央値・最大伸び率・高評価率の中央値です。</li>
      <li><b>急伸ピックアップ</b>：リストの中で、登録者に対していちばん伸びている3本（1,000回以上再生）です。</li>
      <li>各動画の下のオレンジの一言は、いちばん大きい「伸びた理由」です。</li></ol>
    <h3 class="font-black mt-4 mb-1">📺 チャンネルランキング</h3>
    <ul class="list-disc pl-5 space-y-1">
      <li>今伸びているVTuberチャンネルを<b>最大200位</b>まで表示します（50件ずつ「さらに表示」）。切り抜き・まとめ系のチャンネルは入りません。</li>
      <li><b>総合スコア（100点満点）</b>の配点：<b>登録者の増え方（28日間）35点・1日あたりの再生の勢い35点・最近の動画の伸び率20点・投稿の活発さ10点</b>。各項目は、同じ条件（登録者・ジャンル）のチャンネルの中での位置で点数が決まります。</li>
      <li>一覧の「💡」は、そのチャンネルの強い項目（例：再生の勢い 上位3%）です。</li>
      <li>チャンネルを押すと、<b>点数の内訳（表とグラフ）とスコアが高い理由</b>、<b>注目されている動画・ショート・配信</b>（チャンネルの最新50本から形式ごとに再生数の多い5本）、登録者と総再生の推移、最近の動画が見られます。</li>
      <li>登録者の推移は毎日記録していて、<b>28日分で判断</b>します。記録が足りない間は「推移を計測中」と表示され、その項目は外して残りの項目で100点満点に割り直します。</li></ul>
    <p class="mt-2 text-xs text-muted">※ 反応集・ニュース・切り抜き・海外の動画は、AI（Gemini）とキーワードのルールで外しています。同じ人の同じ企画が並ばないように、重複もまとめています。</p>` },
  { id:'g-video', icon:'🔎', title:'動画の詳細と「伸びた理由」', img:'guide/video.jpg', body:`
    <p>動画をタップすると、詳しい数字と<b>「伸びた理由・経緯」</b>が出ます（どのタブの動画でも同じです）。</p>
    <ul class="list-disc pl-5 space-y-1 mt-2"><li><b>数字</b>：再生数・伸び率・1日あたりの再生（公開1日以内は1時間あたり）・高評価率・コメント率・長さ</li>
    <li><b>伸びた理由</b>：「登録者の○倍再生」「初速が強い」「高評価率が高い」「流行ワードに乗っている」「参加型・コラボなどの企画スタイル」「小規模チャンネルからのバズ」など。AIの分析があるときは「AI分析（推定）」も出ます。</li>
    <li><b>チャンネル登録者の推移</b>：毎日の記録から作った小さなグラフです。</li>
    <li><b>リンク</b>：スマホ・タブレットは「▶ YouTubeで開く」、PCは「📋 コピー」でURLをコピーしてブラウザに貼り付けます。チャンネルのリンクもあります。</li>
    <li>詳細の中でさらに動画を開いたときは、左上の「← 戻る」で前の画面に戻れます。閉じるときは右上の「×」、画面の外側、PCの Esc キー、スマホの「戻る」です。</li></ul>` },
  { id:'g-content', icon:'🔥', title:'コンテンツ（流行アーカイブ・新作ゲーム・歴代名作）', img:'guide/archive.jpg', body:`
    <p>上のボタンで<b>📚 流行アーカイブ／🎮 新作ゲーム／👑 歴代名作</b>を切り替えます。</p>
    <h3 class="font-black mt-4 mb-1">📚 流行アーカイブ</h3>
    <ul class="list-disc pl-5 space-y-1"><li>2020年から今年までの、VTuber界隈で流行った企画・ゲーム・曲です。今年の流行は、毎日のVTuber動画から<b>自動で追加</b>されます（「自動収集」と表示）。</li>
    <li><b>年度・ジャンル・タイプ・リバイバル度</b>（今やっても熱い／定番化／過去のバズ）で絞り込めて、並び（新しい順／古い順／今やっても熱い順）も変えられます。50件ずつ「さらに表示」で続きが見られます。</li>
    <li>カードをタップすると、<b>流行った理由・経緯、参考動画、どんな企画（参加型・コラボなど）でやられているか</b>が見られます。自動収集の流行は、初登場日・最大の投稿数・観測日数と、動画／配信／ショートの内訳も出ます。</li>
    <li>右側（スマホは下）の「企画スタイル ランキング」で、表示中の流行がどんな形の企画で多くやられているかが分かります。</li></ul>
    <h3 class="font-black mt-4 mb-1">🎮 新作ゲーム</h3>
    <ul class="list-disc pl-5 space-y-1"><li>Steamで注目されている<b>発売予定／最近発売</b>のゲームです（ジャンル別に最大50件）。</li>
    <li>発売日・価格・対応環境（Steam＝PC）・ジャンルと、<b>VTuberの実況が何本あるか</b>が見られます。タップでSteamのページと、VTuberの実況動画を探すリンクが出ます。PS5・Switchなどの対応は公式サイトで確認してください。</li></ul>
    <h3 class="font-black mt-4 mb-1">👑 歴代名作</h3>
    <ul class="list-disc pl-5 space-y-1"><li>名作ゲームを「YouTubeでよく見られている順」（ゲーム名＋実況で検索した上位50本の合計再生）に並べています。毎日少しずつ計測していて、まだの作品は「計測待ち」です。</li>
    <li>ジャンルで絞り込めて、タップするとよく見られている実況動画が出ます。リバイバル企画のネタ探しにどうぞ。</li></ul>` },
  { id:'g-words', icon:'🔍', title:'検索ワード', img:'guide/words.jpg', body:`
    <p>今どんな言葉が使われ・検索されているかを見られます。</p>
    <ul class="list-disc pl-5 space-y-1 mt-2"><li><b>🔥 話題ワード</b>：VTuber動画のタイトル（【】・『』・#タグ）によく出てくるゲーム名・企画名です。<b>ジャンル × 形式（動画・配信・ショート）× 7日／28日</b>で切り替えられ、何本・何チャンネルが使っているかと合計再生数が出ます。2チャンネル以上が使っているワードを上に並べています。</li>
    <li>ワードの横の印：<b>✨ 新登場</b>（今週初めて出てきた）／<b>🔥 急上昇</b>（前回より大きく増えた）／<b>📈 継続中</b>／<b>↘ 落ち着き</b>。</li>
    <li>話題ワードをタップすると、流行の理由・経緯（AI分析つき）、どんな企画でやられているか、参考動画が見られます。</li>
    <li><b>🔍 YouTube検索候補</b>：YouTubeの検索窓に出てくる候補（よく検索されている言葉）です。ジャンル × 形式で切り替えられます（配信は「〜 配信」、ショートは「〜 shorts」で検索したときの候補）。</li>
    <li><b>🌐 Google急上昇</b>：日本のGoogleで急上昇しているワード（VTuber以外も含む全体）です。直近数日分を合わせて最大50件で、その日のものには「今日」と付きます。</li>
    <li>📋 でワードをコピーできます。配信タイトルやタグを考えるときに便利です。YouTube検索候補は、スマホでは ▶ でそのまま検索、PCでは 🔗 で検索ページのURLをコピーできます。</li></ul>` },
  { id:'g-clip', icon:'✂️', title:'切り抜き', img:'guide/clip.jpg', body:`
    <p>VTuberの切り抜きチャンネル・切り抜き動画のランキングです（トレンドには出しません）。</p>
    <ul class="list-disc pl-5 space-y-1 mt-2"><li>「📺 チャンネル」「🎬 動画」を切り替えられます（それぞれ最大50件）。</li>
    <li><b>登録者の規模</b>（〜1万人／1万〜10万人／10万〜50万人／50万人〜）、<b>形式</b>（動画／ショート）、<b>並び</b>、<b>期間</b>（7日間／28日間）で絞り込めます。</li>
    <li>チャンネルには、名前に「切り抜き」などが入っているか、切り抜き動画が3本以上あるチャンネルが入ります。タップすると、登録者・動画数・合計再生と、そのチャンネルの切り抜き動画一覧が見られます。</li>
    <li>切り抜きのデータは、3日かけて少しずつ貯まっていきます。</li></ul>` },
  { id:'g-ai', icon:'🤖', title:'AI分析', img:'', body:`
    <p>毎日、集めた全データをAIが読んで、<b>今のVTuberの流行・これから流行りそうなもの・VTuberとして活動するならおすすめの企画</b>をまとめています。</p>
    <ul class="list-disc pl-5 space-y-1 mt-2"><li><b>📝 今のVTuberの流行</b>：その日の分析のまとめです。</li>
    <li><b>🔥 今流行っているもの</b>：今週のVTuber動画で伸びているゲーム・企画。YouTubeで探すリンクつき。</li>
    <li><b>🚀 これから流行りそうなもの</b>：増え始めているワードや新作ゲームから、AIが予想したもの。「そう考える理由」と「VTuberがやるなら」の企画案つき。</li>
    <li><b>📊 アルゴリズム・戦略</b>：登録者1万人未満のチャンネルの実データ（形式別の伸び率・伸びる企画・投稿時間帯・タイトルの付け方）から、YouTubeで伸びるための戦略と「やること」。</li>
    <li><b>🎯 おすすめ</b>：登録者1万人未満のVTuber向けに、規模や得意なこと別の、具体的な手順つきのおすすめの活動。</li>
    <li><b>⚠️ 注意点</b>：権利やガイドラインなど、気をつけたいこと。</li>
    <li>右上のメニューで、過去の日付の分析も見返せます（最大14日分）。</li></ul>
    <p class="mt-2 text-xs text-muted">※ AIは、関係ない動画（反応集・ニュース・切り抜き・海外など）をランキングから外すチェックにも使っています。画面の上に、AIがチェックした動画の本数と外した本数が出ます。</p>` },
  { id:'g-know', icon:'🌐', title:'ナレッジ（配信・YouTubeのノウハウ）', img:'guide/know.jpg', body:`
    <p>配信・YouTubeで伸びるためのノウハウ記事です。<b>9つの項目に5本ずつの基本記事</b>があり、さらにYouTubeの解説動画やWeb記事をAIが読んで、<b>毎日記事を追加</b>しています。</p>
    <ul class="list-disc pl-5 space-y-1 mt-2"><li>上の「📂 カテゴリ」で見たい項目を押すと、その記事だけが表示されます。<b>複数選べて</b>、もう一度押すと解除されます。「📚 すべて」で全部に戻ります。</li>
    <li>配信環境・制作：OBS・配信設定／ショート動画のコツ／動画編集のコツ／AI活用術</li>
    <li>トーク・配信運営：トーク力／配信・VTuber運用／メンタル・リスナー維持</li>
    <li>YouTube攻略：アルゴリズム攻略／サムネイル・タイトル術</li>
    <li>記事を押すと全文が開きます。「3行要約」、本文、「VTuberがすぐできること」と、<b>参考にした動画・記事</b>が付いています。「← 記事一覧に戻る」で一覧に戻ります。</li>
    <li>記事の印：<b>基本記事</b>（最初から入っている記事）／<b>🆕 新規</b>（AIが新しく作った記事）／<b>✏️ 修正</b>（似た内容の記事をAIが新しい資料で書き直したもの）。修正された記事は、更新履歴に何を直したかが残ります。</li></ul>` },
  { id:'g-tips', icon:'💡', title:'便利な使い方', img:'', body:`
    <ul class="list-disc pl-5 space-y-1"><li><b>キーワード検索</b>（画面上の ⌕ の欄）：ゲーム名やチャンネル名を入れると、今見ているタブの中から絞り込めます（AI分析・使い方のタブは対象外です）。</li>
    <li><b>伸ばし方を学ぶとき</b>：ナレッジで、気になるカテゴリ（例：トーク力とショート動画のコツ）を複数選んでまとめて読めます。</li>
    <li><b>企画を考えるとき</b>：トレンドで登録者を自分に近い規模に絞る → 伸び率順で見る → 気になる動画の「伸びた理由」を確認 → 検索ワードでタイトルに入れる言葉を探す、の流れがおすすめです。</li>
    <li><b>目標にするチャンネルを探すとき</b>：トレンドの「📺 チャンネルランキング」で登録者を自分に近い規模に絞る → 上位のチャンネルを押して、最近どんな動画を出しているかを見る、のがおすすめです。</li>
    <li><b>ネタに困ったとき</b>：流行アーカイブの「今やっても熱い」や、歴代名作・新作ゲームからリバイバル企画を探せます。</li></ul>` },
  { id:'g-faq', icon:'❓', title:'よくある質問', img:'', body:`
    <dl class="space-y-3"><div><dt class="font-bold">Q. 50件出ないジャンルがあるのはなぜ？</dt><dd class="text-ink/80">A. 条件に合う動画がそもそも少ない場合です。足りないときは期間を広げたり、他のジャンルから近い動画を補充しています（「補充」と表示）。</dd></div>
    <div><dt class="font-bold">Q. 「伸び率」って？</dt><dd class="text-ink/80">A. 再生数 ÷ チャンネル登録者数です。×3.0なら登録者の3倍見られている＝登録者以外にも広がっている動画です。</dd></div>
    <div><dt class="font-bold">Q. 再生数などはいつの数字？</dt><dd class="text-ink/80">A. 毎日17時過ぎの自動更新の時点の数字です。</dd></div>
    <div><dt class="font-bold">Q. 関係ない動画はどうやって外している？</dt><dd class="text-ink/80">A. 毎日の更新のときに、AI（Gemini）が動画のタイトルとチャンネル名を読んで、「VTuber本人の活動か」を1本ずつ判定しています。反応集・ニュース・切り抜き・海外の動画などは外れます。AIが判定していない動画は、キーワードのルールで外しています。</dd></div>
    <div><dt class="font-bold">Q. チャンネルランキングの登録者の増え方が「計測中」になっている</dt><dd class="text-ink/80">A. 登録者の推移は毎日記録していて、2日分以上の記録があるチャンネルから表示されます（28日分で判断）。それまでは、ほかの項目で点数を付けています。</dd></div>
    <div><dt class="font-bold">Q. チャンネルの注目動画が「まだ取得していません」になっている</dt><dd class="text-ink/80">A. YouTubeの無料枠に限りがあるため、ランキング上位になりそうなチャンネル（約300件）から順番に、毎日の更新で取得しています。</dd></div>

  MY.busy = 'インプレッション数を取得中…'; render();
  try { d.reach = await myReach(tok, start, end); } catch (e) { d.reach = { err: e.message }; }

}
function isoDur(s) { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || ''); return m ? ((+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0)) : 0; }
async function myReach(tok, start, end) {
  const RB = 'https://youtubereporting.googleapis.com/v1/';
  const js = await myApi(tok, RB + 'jobs');
  let job = (js.jobs || []).find(j => j.reportTypeId === 'channel_reach_basic_a1');
  if (!job) { job = await myApi(tok, RB + 'jobs', { method: 'POST', body: JSON.stringify({ reportTypeId: 'channel_reach_basic_a1', name: 'VTrend Base' }) }); return { pending: true, since: job.createTime }; }
  const rs = await myApi(tok, RB + 'jobs/' + job.id + '/reports?' + new URLSearchParams({ startTimeAtOrAfter: start.toISOString(), pageSize: 100 }));
  const list = (rs.reports || []).filter(r => new Date(r.startTime) <= end);
  if (!list.length) return { pending: true, since: job.createTime };
  // 同じ日のレポートが作り直されている場合は新しいほうだけ使う
  const byDay = {}; list.forEach(r => { const k = r.startTime.slice(0, 10); if (!byDay[k] || r.createTime > byDay[k].createTime) byDay[k] = r; });
  const out = { imp: 0, clk: 0, byVid: {}, days: 0, daily: {} };
  const reps = Object.values(byDay);
  for (let i = 0; i < reps.length; i += 6) {
    await Promise.all(reps.slice(i, i + 6).map(async rp => {
      const r = await fetch(rp.downloadUrl, { headers: { Authorization: 'Bearer ' + tok.t } });
      if (!r.ok) throw new Error('インプレッションのレポートを読み込めませんでした（' + r.status + '）');
      const lines = (await r.text()).trim().split(/\r?\n/), h = lines.shift().split(',');
      const iv = h.indexOf('video_id'), ii = h.indexOf('video_thumbnail_impressions'), ic = h.indexOf('video_thumbnail_impressions_ctr'), id = h.indexOf('date');
      if (ii < 0) throw new Error('インプレッションの列が見つかりませんでした');
      lines.forEach(l => { const c = l.split(','), imp = +c[ii] || 0; let ctr = +c[ic] || 0; if (ctr > 1) ctr /= 100;
        out.imp += imp; out.clk += imp * ctr; const v = out.byVid[c[iv]] = out.byVid[c[iv]] || { imp: 0, clk: 0 }; v.imp += imp; v.clk += imp * ctr;
        const dk = c[id] || rp.startTime.slice(0, 10); out.daily[dk] = (out.daily[dk] || 0) + imp; });
      out.days++;
    }));
  }
  return out;
}

// ---- VTrend Base のデータと比べる（同じくらいの規模＝登録者1万人未満・同じ形式・同じジャンル） ----
function myBase(fmtId, genre) {
  const pick = g => Object.values((S.data && S.data.videos) || {}).filter(v => !v.ct && v.subs > 0 && v.subs < 1e4 && v.fmt === fmtId && (!g || v.genre === g));
  let all = pick(genre), g = genre;
  if (all.length < 10) { all = pick(null); g = null; }  // ジャンルで絞ると少なすぎるときは形式だけで比べる
  return { n: all.length, g, ratio: median(all.map(v => v.views / v.subs)), like: median(all.filter(v => v.views >= 50).map(v => v.likes / v.views)) };
}

  if (d.mymetric) { MY.metric = d.mymetric; render(); return true; }
  if (d.myvsort) { MY.vsort = d.myvsort; render(); return true; }
  if (d.myeval) { openMyEval(d.myeval); return true; }
  if (d.myprompt !== undefined) { myPrompt(d.myprompt); return true; }
  if (d.mylogout) { myLogout(d.mylogout); toast('ログアウトしました'); render(); return true; }
  if (d.mydel) {
    const nm = (myAccts().find(x => x.cid === d.mydel) || {}).name || 'このアカウント';
    if (!confirm(`「${nm}」をこの端末の一覧から消しますか？\n（YouTubeのチャンネルには何も起きません。この端末に保存した数字・自己プロデュースの入力も消えます）`)) return true;
    myLogout(d.mydel);
    myAcctsSet(myAccts().filter(x => x.cid !== d.mydel));
    ['data', 'pub', 'prof', 'eval'].forEach(k => { delete MYMEM['vtb_my_' + k + '_' + d.mydel]; try { localStorage.removeItem('vtb_my_' + k + '_' + d.mydel); } catch (e) {} });
    delete MY.tokens[d.mydel]; if (MY.sel === d.mydel) MY.sel = null; MY.view = 'home'; toast('消しました'); render(); return true;
  }
  // メイン画面：アカウントを開く・並べ替え・URLで追加
  if (d.myopen) { MY.sel = d.myopen; MY.err = ''; mySet('vtb_my_sel', d.myopen); MY.view = 'review'; MY.evErr = ''; render(); window.scrollTo(0, 0); myPubRefresh(d.myopen); myVaultPull(d.myopen); myFetchIfOld(d.myopen); return true; }
  if (d.mymove) { const [cid, dir] = d.mymove.split(':'), a = myAccts(), i = a.findIndex(x => x.cid === cid), j = i + (+dir);
    if (i >= 0 && j >= 0 && j < a.length) { [a[i], a[j]] = [a[j], a[i]]; myAcctsSet(a); render(); } return true; }
  // 保管庫とこの端末の入力が違うとき：選んだほうを使う
  if (d.myprofuse) { const cid = MY.sel, cf = MY.profConflict && MY.profConflict[cid]; if (!cf) return true;
    const local = myGet('vtb_my_prof_' + cid, {});
    delete MY.profConflict[cid];
    if (d.myprofuse === 'local') { mySet('vtb_my_prof_bak_' + cid, cf.server.prof); myProfPush(cid, 0); toast('この端末の内容を保管庫に入れました'); }
    else { mySet('vtb_my_prof_bak_' + cid, local); mySet('vtb_my_prof_' + cid, cf.server.prof); mySet('vtb_my_profsrv_' + cid, cf.server.at); toast('保管庫の内容にしました'); }
    render(); return true; }
  if (d.myurladd !== undefined) { myUrlAdd(($('#myUrlIn') || {}).value || ''); return true; }
  return false;
}

/* =====================================================================
   12. 画面切り替え・イベント
   ===================================================================== */
function render() {
  const my = S.tab === 'my';
  $$('.tab:not(.mytab)').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
  $$('.mytab').forEach(t => t.setAttribute('aria-selected', t.dataset.myview === MY.view));
  $('header nav').classList.toggle('hidden', my); $('#myNav').classList.toggle('hidden', !my);
  $('#myBtn').innerHTML = my ? '📈 <span class="hidden sm:inline">トレンドに戻る</span><span class="sm:hidden">トレンド</span>' : '👤 <span class="hidden sm:inline">マイチャンネル</span><span class="sm:hidden">マイCH</span>';
  // スマホでは選択中のタブが見えるように、タブの列を横にスクロール
  const nav = $('header nav'), at = $('.tab[aria-selected="true"]');
  if (nav && at && (at.offsetLeft + at.offsetWidth > nav.scrollLeft + nav.clientWidth || at.offsetLeft < nav.scrollLeft)) nav.scrollLeft = at.offsetLeft - 16;
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + S.tab));
  $('#updLine').classList.toggle('hidden', S.tab === 'my');
  ({ trend: renderTrend, ai: renderAI, clip: renderClip, words: renderWords, content: renderContent, know: renderKnow, guide: renderGuide, my: renderMy })[S.tab]();
  // 横スクロールのボタン列は、選択中のボタンが見える位置まで自動でスクロール
  $$('.view:not(.hidden) .scroll-x').forEach(bar => { const on = bar.querySelector('[aria-pressed="true"]'); if (on && (on.offsetLeft + on.offsetWidth > bar.clientWidth || on.offsetLeft < bar.scrollLeft)) bar.scrollLeft = on.offsetLeft - 16; });
}
function setMode() {
  const live = S.mode === 'live';
  $('#modeLabel').textContent = live
    ? '更新 ' + new Date(S.data.updated).toLocaleString('ja-JP', { timeZone:'Asia/Tokyo', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    : 'SAMPLE';
  // 更新が36時間以上止まっているとき・サンプル表示のときはお知らせを出す
  const stale = live && Date.now() - new Date(S.data.updated) > 36 * 3600e3;
  $('#modeDot').className = 'w-2 h-2 rounded-full ' + (live && !stale ? 'bg-lime' : 'bg-amber');
  const n = $('#notice');
  n.textContent = !live ? '⚠️ データを読み込めなかったため、架空のサンプルデータを表示しています。時間をおいて再読み込みしてください。'
    : stale ? '⚠️ データの自動更新が止まっています（最終更新から1日以上）。表示している数字は少し古い可能性があります。' : '';
  n.classList.toggle('hidden', !n.textContent);
}
$$('.tab:not(.mytab)').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; S.kopen = null; store.set('vtb_tab3', S.tab); render(); window.scrollTo(0, 0); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); _titleIdx = null; S.chMore = 50; render(); }, 150); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-close],#mBack,[data-copy],[data-genre],[data-format],[data-cap],[data-kwsrc],[data-kwgenre],[data-kwformat],[data-kwperiod],[data-cttab],[data-arch],[data-archid],[data-more],[data-kcat],[data-tview],[data-chmore],[data-chan],[data-kback],[data-kopen],[data-tok],[data-clipview],[data-cliprange],[data-clipfmt],[data-clipch],[data-gmode],[data-ggenre],[data-cgenre],[data-game],[data-classic],[data-vid],[data-mytab],[data-myacct],[data-mylogin],[data-mydays],[data-myvid],[data-myprompt],[data-mydel],[data-myopen],[data-mymove],[data-myurladd],[data-myprofuse],[data-myrefresh],[data-mysetup],[data-myview],[data-mycfmt],[data-myeval],[data-myrank],[data-myrefadd],[data-myrefdel],[data-mycper],[data-mylogout],[data-mymetric],[data-myvsort]');
  if (!t) return;
  const d = t.dataset;
  if (myClick(t, d)) return;
  if (d.goto) { const s = document.getElementById(d.goto); if (s) { const off = (document.querySelector('header').offsetHeight || 100) + (window.innerWidth < 1024 ? 56 : 16); window.scrollTo({ top: s.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' }); } return; }
  if (d.close !== undefined) return closeModal();
  if (t.id === 'mBack') return backModal();
  if (d.copy !== undefined) { e.stopPropagation(); return copyText(d.copy, d.copymsg || 'URLをコピーしました'); }
  if (d.tview) { S.tview = d.tview; S.chMore = 50; return render(); }
  if (d.chmore) { S.chMore = Math.min(200, S.chMore + 50); return render(); }
  if (d.chan) return openChan(d.chan);
  if (d.genre) { S.genre = d.genre; S.chMore = 50; return render(); }
  if (d.format) { S.format = d.format; return render(); }
  if (d.cap) { S.cap = d.cap; S.chMore = 50; return render(); }
  if (d.kwsrc) { S.kw.src = d.kwsrc; return render(); }
  if (d.kwgenre) { S.kw.genre = d.kwgenre; return render(); }
  if (d.kwformat) { S.kw.format = d.kwformat; return render(); }
  if (d.kwperiod) { S.kw.period = +d.kwperiod; return render(); }
  if (d.cttab) { S.ct.tab = d.cttab; return render(); }
  if (d.arch) { S.arch[d.arch] = d.arch === 'year' && d.val !== 'all' ? +d.val : d.val; S.ct.more = 50; return render(); }
  if (d.archid) return openArch(d.archid);
  if (d.more) { S.ct.more += 50; return render(); }
  // 押すたびに選択／解除（複数選択）。「すべて」で解除
  if (d.kcat) { S.kcats = d.kcat === 'all' ? [] : S.kcats.includes(d.kcat) ? S.kcats.filter(c => c !== d.kcat) : [...S.kcats, d.kcat]; return render(); }
  if (d.kback !== undefined) { S.kopen = null; render(); return window.scrollTo(0, 0); }
  if (d.kopen) { S.kopen = d.kopen; S.tab = 'know'; render(); return window.scrollTo(0, 0); }
  if (d.tok) return openToken(d.tok);
  if (d.clipview) { S.clip.view = d.clipview; return render(); }
  if (d.cliprange) { S.clip.range = d.cliprange; return render(); }
  if (d.clipfmt) { S.clip.fmt = d.clipfmt; return render(); }
  if (d.clipch) return openClipCh(d.clipch);
  if (d.gmode) { S.ct.gmode = d.gmode; return render(); }
  if (d.ggenre) { S.ct.ggenre = d.ggenre; return render(); }
  if (d.cgenre) { S.ct.cgenre = d.cgenre; return render(); }
  if (d.game) return openGame(d.game);
  if (d.classic) return openClassic(d.classic);
  if (d.vid) return openVideo(d.vid);
});
document.addEventListener('input', e => { if (e.target.dataset.myprof) myProfSave(e.target); if (e.target.dataset.myref) myRefSave(e.target); });
document.addEventListener('change', e => { const k = e.target.dataset.mydate; if (k) { MY[k === 'from' ? 'cfrom' : 'cto'] = e.target.value; render(); } });
document.addEventListener('change', e => {
  const k = e.target.dataset.set; if (!k) return;
  if (k === 'sort') S.sort = e.target.value;
  if (k === 'period') S.period = +e.target.value;
  if (k === 'archsort') S.arch.sort = e.target.value;
  if (k === 'clipsort') S.clip.sort = e.target.value;
  if (k === 'clipperiod') S.clip.period = +e.target.value;
  if (k === 'aiidx') S.aiIdx = +e.target.value;
  render();
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-selectall]')) e.target.select(); });
// 埋め込み（Wix）の中：新しいタブで開いてみて、ブロックされたらURLをコピーする
if (IN_FRAME) document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[target="_blank"]'); if (!a || !a.href) return;
  e.preventDefault();
  // Wixの中から開いたタブはWixの制限を引き継ぐため、YouTubeの動画ページ（watch）は表示を断られる。
  // 動画は「埋め込み用の再生ページ」（制限があっても表示できる）で開く。チャンネル・検索のページは開けないのでURLをコピーする
  let u = a.href; const m = /^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})(?:[^#]*?[?&]t=(\d+))?/.exec(u);
  if (m) u = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1' + (m[2] ? '&start=' + m[2] : '');
  else if (/^https:\/\/(www\.|m\.)?youtube\.com\//.test(u)) return copyText(u, 'YouTubeのこのページはWixの中からは開けないので、URLをコピーしました。新しいタブに貼り付けてください');
  let w = null; try { w = window.open(u, '_blank'); } catch (x) {}
  if (w) { try { w.opener = null; } catch (x) {} } else copyText(a.href, 'このページの中では開けなかったので、URLをコピーしました。新しいタブに貼り付けてください');
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async () => {
  await loadData();
  myLoadTokens();
  setMode(); render();
  // Googleのログインから戻ってきたときは、そのままチャンネルの数字を取りに行く
  if (myPending) { const p = myPending; myPending = null; if (p.code) myVaultLogin(p.code, p.redirect, p.want); else myAfterLogin(p.r, p.want); }
  // 保管庫でログインしているアカウントは、鍵が切れる前に自動で新しくする（ずっとログイン）
  if (MY_VAULT) { myKeep(); setInterval(myKeep, 4 * 60e3);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { myKeep(); if (S.tab === 'my' && MY.sel && MY.view !== 'home') myVaultPull(MY.sel); } }); }
})();
</script>
