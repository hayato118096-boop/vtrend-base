<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTrend Base</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { void:'#f5f7fb', ink:'#1f2433', panel:'#ffffff', panel2:'#ffffff', line:'#e2e6ef', neon:'#0891b2', pink:'#db2777', lime:'#4d7c0f', amber:'#d97706', muted:'#6b7280' },
    fontFamily: { sans:['"Noto Sans JP"','system-ui','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] }
  } }
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { background:#f5f7fb; color:#1f2433; overflow-x:hidden; }
  .grid-bg { background-image:
      linear-gradient(rgba(8,145,178,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(8,145,178,.05) 1px, transparent 1px);
    background-size: 32px 32px; }
  .glow { box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(8,145,178,.10); }
  .glow-pink { box-shadow: 0 0 0 1px rgba(219,39,119,.35), 0 4px 16px rgba(219,39,119,.12); }
  .chip { transition: all .15s; }
  .chip[aria-pressed="true"] { background:#0891b2; color:#fff; border-color:#0891b2; box-shadow:0 2px 8px rgba(8,145,178,.25); }
  .tab[aria-selected="true"] { color:#0891b2; }
  .tab[aria-selected="true"]::after { content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; background:#0891b2; }
  .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { scrollbar-width:none; }
  .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  input, select { color-scheme: light; }
</style>
</head>
<body class="font-sans min-h-screen grid-bg">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 bg-void/85 backdrop-blur border-b border-line">
  <div class="max-w-7xl mx-auto px-4 pt-3 flex items-center gap-3">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon to-pink grid place-items-center font-black text-white">V</div>
      <div class="leading-tight hidden sm:block">
        <div class="font-black tracking-wide">VTrend <span class="text-neon">Base</span></div>
        <div class="text-[10px] text-muted font-mono">JP TREND INTELLIGENCE</div>
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <label class="relative block">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm">⌕</span>
        <input id="q" type="search" placeholder="キーワード検索"
          class="w-full bg-panel border border-line rounded-lg pl-8 pr-3 py-2 text-sm placeholder:text-muted/70 focus:outline-none focus:border-neon/60">
      </label>
    </div>
    <div class="shrink-0 flex items-center gap-2 bg-panel border border-line rounded-lg px-2.5 sm:px-3 py-2 text-[11px] sm:text-xs" title="データは毎日0時過ぎ（日本時間）に自動更新されます">
      <span id="modeDot" class="w-2 h-2 rounded-full bg-amber"></span><span id="modeLabel" class="font-mono whitespace-nowrap">…</span>
    </div>
  </div>
  <nav class="max-w-7xl mx-auto px-2 mt-2 flex overflow-x-auto no-scrollbar" role="tablist">
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="trend" role="tab">📈 トレンド</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="archive" role="tab">🗂 過去の流行</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="know" role="tab">🌐 <span class="hidden sm:inline">解説</span>ナレッジ</button>
    <button class="tab relative px-3 sm:px-4 py-3 text-sm font-bold text-muted hover:text-ink whitespace-nowrap" data-tab="bm" role="tab">★ <span class="hidden sm:inline">ブックマーク</span><span class="sm:hidden">保存</span> <span id="bmCount" class="ml-1 text-[10px] font-mono bg-pink/20 text-pink rounded px-1.5 py-0.5">0</span></button>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 py-5 pb-20">
  <section id="view-trend" class="view"></section>
  <section id="view-archive" class="view hidden"></section>
  <section id="view-know" class="view hidden"></section>
  <section id="view-bm" class="view hidden"></section>
</main>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-panel2 border border-neon/40 text-sm rounded-full shadow-lg px-4 py-2 glow opacity-0 pointer-events-none transition-opacity"></div>

<script>
/* =====================================================================
   0. ユーティリティ
   ===================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '億';
  if (n >= 1e4) return (n/1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,'') + '万';
  return Math.round(n).toLocaleString('ja-JP');
};
const rtf = new Intl.RelativeTimeFormat('ja', { numeric:'auto' });
const ago = d => {
  const s = (d - Date.now()) / 1000, a = Math.abs(s);
  if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if (a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return rtf.format(Math.round(s/86400/30), 'month');
};
const ytSearchUrl = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 1600);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function spark(arr, w=72, h=22) {
  if (!arr || arr.length < 2) return '<span class="text-[10px] text-muted">推移データ蓄積中</span>';
  const min = Math.min(...arr), max = Math.max(...arr), r = max - min || 1;
  const pts = arr.map((v,i) => `${(i/(arr.length-1)*w).toFixed(1)},${(h - (v-min)/r*(h-4) - 2).toFixed(1)}`).join(' ');
  const up = arr[arr.length-1] >= arr[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? '#16a34a' : '#db2777'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

/* =====================================================================
   1. 状態
   ===================================================================== */
const S = {
  tab: store.get('vtb_tab', 'trend'),
  data: null,
  mode: 'demo',
  genre: 'all', sort: 'ratio', period: 7, vtOnly: true,
  videos: [], loading: false, error: '', note: '',
  q: '',
  arch: { year:'all', genre:'all', type:'all', revival:'all', sort:'new' },
  kcat: 'all', kopen: null,
};
let BM = store.get('vtb_bm', { trend:{}, arch:{}, know:{} });
const saveBM = () => { store.set('vtb_bm', BM); updateBMCount(); };
const updateBMCount = () => { $('#bmCount').textContent = Object.keys(BM.trend).length + Object.keys(BM.arch).length + Object.keys(BM.know).length; };

const GENRES = [
  { id:'all',   label:'すべて',     kw:'',          cat:null },
  { id:'game',  label:'ゲーム',     kw:'ゲーム実況', cat:'20' },
  { id:'song',  label:'歌ってみた', kw:'歌ってみた', cat:'10' },
  { id:'talk',  label:'雑談',       kw:'雑談',       cat:null },
  { id:'plan',  label:'企画',       kw:'企画',       cat:null },
  { id:'short', label:'ショート',   kw:'#shorts',    cat:null, short:true },
];
const SORTS = [
  { id:'ratio',  label:'伸び率（再生÷登録者）' },
  { id:'views',  label:'再生数' },
  { id:'new',    label:'新しい順' },
  { id:'engage', label:'高評価率' },
];

/* =====================================================================
   2. データ取得：data.json
   GitHub Actions（scripts/update.mjs）が毎日0時過ぎ（日本時間）に生成する。
   見つからないとき（ローカルで開いた時など）はサンプルデータを表示。
   ===================================================================== */
const DATA_URL = 'data.json';
const isChart = (gid, vtOnly) => !vtOnly && (gid === 'all' || !!(GENRES.find(g => g.id === gid) || {}).cat);
const setKey = () => [S.genre, isChart(S.genre, S.vtOnly) ? 'chart' : S.period, S.vtOnly ? 1 : 0].join('|');
async function loadData() {
  try {
    const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); // 日本時間の日付が変わったら取り直す
    const r = await fetch(DATA_URL + '?d=' + day, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.sets || !d.videos) throw new Error('bad data');
    Object.values(d.videos).forEach(v => {
      v.published = new Date(v.published);
      v.url = 'https://www.youtube.com/watch?v=' + v.id;
      v.isShort = v.dur > 0 && v.dur <= 180;
    });
    S.data = d; S.mode = 'live';
  } catch (e) { S.data = null; S.mode = 'demo'; }
}
/* =====================================================================
   3. データ取得：DEMO（架空のサンプル）
   ===================================================================== */
const DEMO_HIST = {};
function demoData() {
  const r = rng(20261104);
  const chans = [
    ['星宮ルナ',1420000],['黒羽ネオ',860000],['白雪ミント',412000],['鳴神カグラ',238000],['月見里ユウ',156000],
    ['猫宮ぽぷら',98000],['天ヶ瀬ソラ',71000],['夜桜しずく',52000],['雷堂ジン',34000],['花咲ここ',21000],
    ['氷室アオイ',14800],['灯火リラ',9200],['紫苑メイ',6100],['朝霧ハル',4300],['狐火こはく',2900],
    ['碧海ナギ',188000],['七瀬ルル',27000],['鉄塚ゴウ',11500],
  ].map(([name, subs], i) => ({ name, subs, id:'demo-ch-'+i }));
  chans.forEach(c => {
    const g = 0.002 + r()*0.02; let n = c.subs / Math.pow(1+g, 14);
    DEMO_HIST[c.id] = Array.from({length:15}, () => { const v = Math.round(n); n *= 1 + g*(0.4 + r()*1.2); return v; });
    DEMO_HIST[c.id][14] = c.subs;
  });
  const T = {
    game:  ['【PEAK】4人で山頂を目指したら友情が崩壊した','【初見ホラー】叫ばずに完走できたら勝ち','【マリオカート ワールド】視聴者参加型！1位取るまで終われない','【スト6】ランクマ耐久 ダイヤ行くまで寝れない','【R.E.P.O.】ポンコツ回収班、出動します','【異変探し】1つも見逃さずにクリアする','【Minecraft】サーバーに巨大建築つくる','【雀魂】初心者がコラボ麻雀で役満を狙う'],
    song:  ['【歌ってみた】メズマライザー / cover','【歌枠】リクエスト全部歌う耐久','【オリジナル曲】初のオリ曲MV公開','【歌ってみた】ラビットホール / cover','【歌ってみた】ハモリ全部ひとりで録った','【歌枠リレー】トップバッター'],
    talk:  ['【雑談】マシュマロ読みながらまったり','【朝活】おはようを言いに来て','【雑談】登録者ありがとう振り返り','【作業雑談】一緒に作業しよ','【雑談】最近ハマってるもの全部話す'],
    plan:  ['【企画】リスナーの黒歴史を発表する会','【凸待ち】誰か来てくれるまで終われない','【企画】100人に聞いたランキングを当てる','【3D】初お披露目、何でもやります','【企画】1日を視聴者に決めてもらう'],
    short: ['声だけで何のゲームか当てて #shorts','この反応は本物です #Vtuber','1秒で落ちる人の特徴 #shorts','配信中に起きた奇跡 #shorts','先輩に絶対言っちゃダメなこと #shorts','このサムネで何が起きたか分かる？ #shorts'],
  };
  const gs = Object.keys(T), vids = [];
  for (let i = 0; i < 160; i++) {
    const genre = gs[Math.floor(r()*gs.length)], c = chans[Math.floor(r()*chans.length)];
    const title = T[genre][Math.floor(r()*T[genre].length)];
    let mult = Math.exp((r() - 0.62) * 2.6);           // だいたい登録者の0.1〜2倍
    if (r() < 0.12) mult *= 4 + r()*10;                 // たまにバズる
    if (genre === 'short') mult *= 2.2;
    const views = Math.max(120, Math.round(c.subs * mult * (c.subs < 30000 ? 1.4 : 0.5)));
    const isLive = genre !== 'short' && genre !== 'song' && r() < 0.12;
    vids.push({
      id: 'demo-' + i, title, ch: c.name, chId: c.id, subs: c.subs, views,
      likes: Math.round(views * (0.025 + r()*0.06)), comments: Math.round(views * (0.002 + r()*0.01)),
      published: new Date(Date.now() - r()*30*864e5), dur: genre === 'short' ? 20 + Math.round(r()*40) : 600 + Math.round(r()*9000),
      thumb: '', isShort: genre === 'short',
      live: isLive ? Math.round(c.subs * (0.01 + r()*0.05)) : null,
      genre, url: ytSearchUrl(title), demo: true,
    });
  }
  return vids;
}

/* =====================================================================
   4. トレンド タブ
   ===================================================================== */
function pickVideos() {
  if (S.mode === 'live') {
    S.videos = (S.data.sets[setKey()] || []).map(id => S.data.videos[id]).filter(Boolean);
    const g = GENRES.find(x => x.id === S.genre);
    S.note = isChart(S.genre, S.vtOnly) ? `日本の急上昇チャート（${g.label}）`
      : `「${[S.vtOnly ? 'VTuber' : '', g.kw].filter(Boolean).join(' ') || 'VTuber'}」直近${S.period === 1 ? '24時間' : S.period + '日'}・再生数順`;
  } else {
    if (!S._demo) S._demo = demoData();
    S.videos = S._demo;
    S.note = 'サンプルデータを表示中（data.json が見つかりません）';
  }
}
const ratioOf = v => v.subs ? v.views / v.subs : null;
function trendList() {
  let list = S.videos.slice();
  if (S.mode === 'demo') {
    list = list.filter(v => (Date.now() - v.published) <= S.period*864e5);
    if (S.genre === 'short') list = list.filter(v => v.isShort);
    else if (S.genre !== 'all') list = list.filter(v => v.genre === S.genre);
  }
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter(v => (v.title + v.ch).toLowerCase().includes(q)); }
  const key = { ratio: v => ratioOf(v) ?? -1, views: v => v.views, new: v => +v.published, engage: v => v.views ? v.likes / v.views : 0 }[S.sort];
  return list.sort((a, b) => key(b) - key(a));
}
function subsHist(v) {
  if (v.demo) return DEMO_HIST[v.chId];
  const h = S.data && S.data.subs && S.data.subs[v.chId];
  return h ? h.map(x => x.n) : null;
}
function ratioBadge(r, big) {
  if (r == null) return `<span class="font-mono text-xs text-muted">登録者非公開</span>`;
  const cls = r >= 3 ? 'text-pink border-pink/50 bg-pink/10' : r >= 1 ? 'text-neon border-neon/50 bg-neon/10' : 'text-muted border-line bg-ink/5';
  return `<span class="font-mono font-bold border rounded-md ${big ? 'text-lg px-2 py-0.5' : 'text-xs px-1.5 py-0.5'} ${cls}">×${r >= 10 ? r.toFixed(0) : r.toFixed(1)}</span>`;
}
function thumbHTML(v, cls) {
  if (v.thumb) return `<img src="${esc(v.thumb)}" alt="" loading="lazy" class="${cls} object-cover">`;
  const hue = [...v.chId].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  return `<div class="${cls} grid place-items-center text-2xl font-black" style="color:hsl(${hue} 45% 30%);background:linear-gradient(135deg,hsl(${hue} 75% 90%),hsl(${(hue+50)%360} 70% 80%))">${esc(v.ch[0])}</div>`;
}
function median(a) { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }

function renderTrend() {
  const el = $('#view-trend');
  const list = S.loading ? [] : trendList();
  const ratios = list.map(ratioOf).filter(x => x != null);
  const lives = list.filter(v => v.live != null);
  const picks = list.filter(v => ratioOf(v) != null && v.views >= 500).sort((a,b) => ratioOf(b) - ratioOf(a)).slice(0, 3);
  const chartMode = S.mode === 'live' && isChart(S.genre, S.vtOnly);

  el.innerHTML = `
  <div class="flex flex-col gap-3 mb-4">
    <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
      ${GENRES.map(g => `<button class="chip shrink-0 border border-line rounded-full px-4 py-1.5 text-sm font-bold bg-panel hover:border-neon/50" data-genre="${g.id}" aria-pressed="${S.genre === g.id}">${g.label}</button>`).join('')}
    </div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <select id="sortSel" class="bg-panel border border-line rounded-lg px-3 py-1.5">
        ${SORTS.map(s => `<option value="${s.id}" ${S.sort === s.id ? 'selected' : ''}>並び: ${s.label}</option>`).join('')}
      </select>
      <select id="periodSel" class="bg-panel border border-line rounded-lg px-3 py-1.5" ${chartMode ? 'disabled title="急上昇チャートは期間指定なし"' : ''}>
        ${[[1,'24時間'],[7,'7日間'],[30,'30日間']].map(([d,l]) => `<option value="${d}" ${S.period === d ? 'selected' : ''}>期間: ${l}</option>`).join('')}
      </select>
      <label class="flex items-center gap-2 bg-panel border border-line rounded-lg px-3 py-1.5 cursor-pointer select-none">
        <input id="vtOnly" type="checkbox" class="accent-[#0891b2]" ${S.vtOnly ? 'checked' : ''}> VTuberに絞る
      </label>
      <span class="text-xs text-muted">${esc(S.note)}</span>
    </div>
  </div>

  ${S.error ? `<div class="mb-4 border border-pink/50 bg-pink/10 rounded-xl p-3 text-sm">取得エラー: ${esc(S.error)}<br><span class="text-muted text-xs">APIキー・クォータ残量を確認してください。右上からDEMOに切り替えられます。</span></div>` : ''}

  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 mb-5">
    ${kpi('平均再生数', fmt(list.length ? list.reduce((a,v) => a + v.views, 0) / list.length : null), `${list.length}本の平均`)}
    ${kpi('伸び率 中央値', ratios.length ? '×' + median(ratios).toFixed(2) : '—', '再生数 ÷ 登録者数')}
    ${kpi('最大伸び率', ratios.length ? '×' + Math.max(...ratios).toFixed(1) : '—', 'このリスト内の最高倍率', 'pink')}
    ${kpi('同時接続（配信中）', lives.length ? fmt(lives.reduce((a,v) => a + v.live, 0) / lives.length) : '—', lives.length ? `配信中${lives.length}本の平均` : '配信中の動画なし')}
  </div>

  ${picks.length ? `
  <h2 class="font-black mb-2 flex items-center gap-2"><span class="text-pink">🔥</span>急伸企画ピックアップ <span class="hidden sm:inline text-xs font-normal text-muted">登録者に対して再生が伸びている順</span></h2>
  <div class="flex md:grid md:grid-cols-3 gap-3 mb-6 overflow-x-auto no-scrollbar snap-x scroll-px-4 -mx-4 px-4 py-1 md:mx-0 md:px-0">
    ${picks.map((v, i) => `
      <article class="relative shrink-0 w-[72%] sm:w-[48%] md:w-auto snap-start bg-panel border border-line rounded-xl overflow-hidden ${i === 0 ? 'glow-pink' : ''}">
        <a href="${esc(v.url)}" target="_blank" rel="noopener" class="block relative">
          ${thumbHTML(v, 'w-full aspect-video')}
          <span class="absolute top-2 left-2">${ratioBadge(ratioOf(v), true)}</span>
          ${v.live != null ? '<span class="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">LIVE</span>' : ''}
        </a>
        <div class="p-3">
          <h3 class="text-sm font-bold line-clamp-2 mb-1">${esc(v.title)}</h3>

  if (e.target.id === 'sortSel') { S.sort = e.target.value; renderTrend(); }
  if (e.target.id === 'periodSel') { S.period = +e.target.value; pickVideos(); renderTrend(); }
  if (e.target.id === 'vtOnly') { S.vtOnly = e.target.checked; pickVideos(); renderTrend(); }
  if (e.target.id === 'archSort') { S.arch.sort = e.target.value; renderArchive(); }
});

// 起動
(async () => {
  updateBMCount();
  await loadData();
  pickVideos(); setMode(); render();
})();
</script>
</body>
