name: Update trend data

on:
  schedule:
    # 毎日 0:17（日本時間）＝ 15:17（UTC）。GitHub側の混雑で数十分遅れることがあります
    - cron: '17 15 * * *'
  workflow_dispatch: # Actions画面の「Run workflow」ボタンから手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube data
        run: node scripts/update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
